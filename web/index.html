<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pitacco | Gestão</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#1f2937;background:#f5f6fa}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.hidden{display:none!important}.shell{display:flex;min-height:100vh}.sidebar{width:246px;flex-shrink:0;background:#172033;color:#e5e7eb;padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:27px;font-weight:850;color:#ff862d;padding:4px 12px 24px}.brand small{display:block;font-size:10px;letter-spacing:1px;color:#aab4c6}.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;color:#cbd5e1;text-align:left;padding:13px 15px;border-radius:11px;width:100%}.nav button.active,.nav button:hover{background:#ff862d;color:#fff}.main{min-width:0;flex:1}.top{background:#fff;border-bottom:1px solid #e8ebef;padding:17px 26px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:2}.content{padding:26px;max-width:1500px;margin:auto}.title{font-size:26px;font-weight:800;margin:0 0 6px}.muted{color:#778294;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin:20px 0}.card{background:white;border:1px solid #e8edf3;border-radius:16px;padding:20px;box-shadow:0 2px 12px #1e293b08}.metric{font-size:28px;font-weight:800;margin:10px 0 0}.btn{background:#f58025;color:white;border:0;border-radius:10px;padding:11px 17px;font-weight:700}.btn.secondary{background:#fff;color:#344054;border:1px solid #d7dce4}.btn.danger{background:#b42318}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.split{display:grid;grid-template-columns:minmax(280px,1fr) minmax(320px,1.3fr);gap:16px}.item{padding:13px;border-bottom:1px solid #edf0f3;cursor:pointer}.item:hover,.item.selected{background:#fff4eb}.pill{display:inline-block;background:#fff0df;color:#ad5300;padding:4px 9px;border-radius:30px;font-size:12px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0;font-size:13px;font-weight:600}.field input,.field select,.field textarea{padding:12px;border:1px solid #d4dbe5;border-radius:10px;background:white;width:100%}.field textarea{min-height:80px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}td,th{padding:13px;border-bottom:1px solid #edf0f3;text-align:left;font-size:13px}th{color:#667085}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(130deg,#172033,#313e52)}.login .card{width:min(420px,100%)}.login h1{color:#ef7e23}.notice{padding:12px;border-radius:10px;background:#fff2df;color:#9b5700;margin:12px 0}.error{background:#fff0f0;color:#a11}.mobilemenu{display:none}.public{max-width:1050px;margin:auto;padding:24px}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.productimg{height:130px;background:#fff3e7;border-radius:10px;object-fit:cover;width:100%}.footer{font-size:12px;color:#8a96a7;margin-top:40px}
@media(max-width:900px){.sidebar{position:fixed;left:-260px;z-index:5;transition:left .2s}.sidebar.open{left:0}.mobilemenu{display:inline-block}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.content{padding:15px}.top{padding:12px 15px}}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr;gap:8px}.card{padding:13px}.metric{font-size:22px}}
</style></head><body>
<div id="login" class="login"><div class="card"><h1>🛍 Pitacco</h1><p class="muted">Gestão de pedidos e delivery</p><form id="loginForm"><label class="field">E-mail<input id="email" type="email" required autocomplete="username"></label><label class="field">Senha<input id="password" type="password" required autocomplete="current-password"></label><button class="btn" style="width:100%">Entrar</button></form><div class="actions"><button class="btn secondary" id="reset">Recuperar senha</button></div><p class="muted" id="loginMessage"></p></div></div>
<div id="app" class="shell hidden"><aside class="sidebar" id="sidebar"><div class="brand">🛍 Pitacco<small>SEJA QUAL FOR, TÁ NA MÃO!</small></div><div class="card" style="background:#253047;color:white;border:0;padding:12px;margin-bottom:18px"><strong id="storeName">Minha loja</strong><div class="muted" id="storeHint">Painel de gestão</div></div><nav class="nav" id="nav"><button data-page="dashboard" class="active">▦ Visão geral</button><button data-page="orders">▤ Pedidos</button><button data-page="products">▧ Produtos e cardápio</button><button data-page="delivery">♧ Entregas</button><button data-page="printing">▣ Impressão</button><button data-page="finance">◈ Financeiro</button><button data-page="settings">⚙ Configurações</button></nav><div class="footer">Pitacco • Nova interface web</div></aside><main class="main"><header class="top"><div><button class="btn secondary mobilemenu" id="mobilemenu">☰</button> <strong id="pageTitle">Visão geral</strong></div><div><span class="pill" id="status">Conectado</span> <button class="btn secondary" id="logout">Sair</button></div></header><div class="content" id="content"></div></main></div>
<div id="publicMenu" class="hidden"></div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const URL='https://mdevzehqcpcgxspwbiyz.supabase.co';
const KEY='sb_publishable_JLIp1y5II26GrztrKDNIyQ_ryETrCuj';
const db=createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
let user=null,store=null,orders=[],products=[],selected=null,page='dashboard',menuSettings=null;
const reserved=new Set(['www','app','pitacco','admin','api','mail']);
const slug=location.hostname.endsWith('.pitacco.com.br')?location.hostname.slice(0,-'.pitacco.com.br'.length):'';
function notice(msg,bad=false){return '<div class="notice '+(bad?'error':'')+'">'+esc(msg)+'</div>'}
function render(html){$('content').innerHTML=html}
function errorText(e){return e?.message||'Não foi possível concluir. Tente novamente.'}
async function loadStore(){const {data:members,error:e}=await db.from('store_members').select('store_id,role').eq('user_id',user.id).limit(1);if(e)throw e;if(!members?.length)throw Error('Seu usuário ainda não está vinculado a uma loja. Solicite a vinculação ao administrador.');const r=await db.from('stores').select('*').eq('id',members[0].store_id).single();if(r.error)throw r.error;store=r.data;$('storeName').textContent=store.name;}
async function loadData(){const [a,b,c]=await Promise.all([db.from('orders').select('*').eq('store_id',store.id).order('created_at',{ascending:false}).limit(100),db.from('products').select('*').eq('store_id',store.id).order('created_at',{ascending:false}),db.from('public_menu_settings').select('*').eq('store_id',store.id).maybeSingle()]);if(a.error)throw a.error;if(b.error)throw b.error;if(c.error)throw c.error;orders=a.data||[];products=b.data||[];menuSettings=c.data;}
async function refresh(){await loadData();show(page)}
function show(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('sidebar').classList.remove('open');const names={dashboard:'Visão geral',orders:'Pedidos',products:'Produtos e cardápio',delivery:'Entregas',printing:'Impressão',finance:'Financeiro',settings:'Configurações'};$('pageTitle').textContent=names[p];({dashboard,ordersPage,productsPage,deliveryPage,printingPage,financePage,settingsPage})[{dashboard:'dashboard',orders:'ordersPage',products:'productsPage',delivery:'deliveryPage',printing:'printingPage',finance:'financePage',settings:'settingsPage'}[p]]();}
function dashboard(){const today=new Date().toDateString();const todayOrders=orders.filter(o=>new Date(o.created_at).toDateString()===today);const sum=todayOrders.reduce((s,o)=>s+Number(o.gross||0),0);render('<h1 class="title">Olá! 👋</h1><p class="muted">Acompanhe sua operação em um só lugar.</p><div class="grid"><div class="card">Pedidos hoje<div class="metric">'+todayOrders.length+'</div></div><div class="card">Faturamento bruto hoje<div class="metric">'+money(sum)+'</div></div><div class="card">Pedidos pendentes<div class="metric">'+orders.filter(o=>o.status==='pending').length+'</div></div><div class="card">Produtos cadastrados<div class="metric">'+products.length+'</div></div></div><div class="actions"><button class="btn" data-go="orders">Ver pedidos</button><button class="btn secondary" data-go="products">Gerenciar produtos</button><button class="btn secondary" data-go="settings">Meu cardápio</button></div><div class="card"><h3>Últimos pedidos</h3>'+orderTable(orders.slice(0,8))+'</div>')}
function orderTable(list){return '<div class="tablewrap"><table><thead><tr><th>Pedido</th><th>Origem</th><th>Valor</th><th>Status</th><th>Data</th></tr></thead><tbody>'+list.map(o=>'<tr><td>'+esc(o.id.slice(0,8))+'</td><td>'+esc(o.channel)+'</td><td>'+money(o.gross)+'</td><td><span class="pill">'+esc(o.status)+'</span></td><td>'+new Date(o.created_at).toLocaleString('pt-BR')+'</td></tr>').join('')+'</tbody></table></div>'}
function ordersPage(){render('<h1 class="title">Pedidos</h1><p class="muted">Acompanhe pedidos reais registrados no Supabase.</p><div class="actions"><button class="btn" id="reload">Atualizar pedidos</button></div><div class="split"><div class="card"><h3>Fila de pedidos</h3>'+orders.map(o=>'<div class="item '+(selected===o.id?'selected':'')+'" data-order="'+esc(o.id)+'"><strong>#'+esc(o.id.slice(0,8))+'</strong> · '+money(o.gross)+'<div class="muted">'+esc(o.channel)+' · '+esc(o.status)+'</div></div>').join('')+'</div><div class="card" id="orderDetail">'+orderDetail()+'</div></div>')}
function orderDetail(){const o=orders.find(x=>x.id===selected)||orders[0];if(!o)return notice('Nenhum pedido encontrado.');selected=o.id;return '<h3>Pedido #'+esc(o.id.slice(0,8))+'</h3><p>Status: <strong>'+esc(o.status)+'</strong></p><p>Canal: '+esc(o.channel)+'</p><p>Valor bruto: '+money(o.gross)+'</p><p>Taxas: '+money(o.fees)+'</p><p>Recebido: '+new Date(o.created_at).toLocaleString('pt-BR')+'</p>'+(o.status==='pending'?'<button class="btn" id="accept">Aceitar pedido</button>':'')+(o.status==='accepted'?'<p class="muted">Pedido aceito. Consulte o aplicativo de impressão para acompanhar a fila.</p>':'')}
function productsPage(){render('<h1 class="title">Produtos e cardápio</h1><p class="muted">Cadastre produtos da loja e escolha o que aparece no cardápio.</p><div class="split"><div class="card"><h3>Novo produto</h3><form id="productForm"><label class="field">Nome<input name="name" required maxlength="120"></label><label class="field">Categoria<input name="category"></label><label class="field">Descrição<textarea name="description"></textarea></label><label class="field">Preço (R$)<input name="price" type="number" min="0" step="0.01" required></label><label class="field">Custo (R$)<input name="cost" type="number" min="0" step="0.01" value="0" required></label><label class="field">URL da foto<input name="image_url" type="url"></label><label><input name="menu_active" type="checkbox" checked> Visível no cardápio</label><div class="actions"><button class="btn">Salvar produto</button></div></form></div><div class="card"><h3>Produtos ('+products.length+')</h3>'+products.map(p=>'<div class="item"><strong>'+esc(p.name)+'</strong><div class="muted">'+money(p.price)+' · '+esc(p.category)+' · '+(p.menu_active?'Publicado':'Oculto')+'</div><button class="btn secondary" data-toggle="'+esc(p.id)+'">'+(p.menu_active?'Ocultar':'Publicar')+'</button></div>').join('')+'</div></div>')}
function deliveryPage(){render('<h1 class="title">Entregas</h1>'+notice('O despacho e o rastreamento permanecem no backend existente. Este painel será integrado aos fluxos já implementados; nenhuma entrega será simulada.')+'<div class="card"><p>Consulte o módulo operacional existente enquanto a integração desta nova tela não estiver validada.</p></div>')}
function printingPage(){render('<h1 class="title">Impressão</h1>'+notice('A impressão física depende do agente Windows e da fila local. O navegador não confirma impressão em papel.')+'<div class="card"><h3>Impressoras e filas</h3><p>As configurações existentes serão preservadas. Edição, teste e reimpressão só serão habilitados após integração com o serviço Windows.</p></div>')}
function financePage(){render('<h1 class="title">Financeiro</h1><div class="grid"><div class="card">Bruto dos últimos pedidos<div class="metric">'+money(orders.reduce((s,o)=>s+Number(o.gross||0),0))+'</div></div><div class="card">Taxas registradas<div class="metric">'+money(orders.reduce((s,o)=>s+Number(o.fees||0),0))+'</div></div></div>'+notice('Valores calculados apenas sobre os últimos 100 pedidos carregados; não constituem conciliação financeira completa.'))}
function settingsPage(){render('<h1 class="title">Configurações da loja</h1><div class="split"><div class="card"><h3>Identidade</h3><p><strong>'+esc(store.name)+'</strong></p><p class="muted">O logotipo e os dados da loja permanecem vinculados ao estabelecimento.</p></div><div class="card"><h3>Cardápio digital individual</h3><form id="menuForm"><label class="field">Endereço da loja<input name="slug" pattern="[a-z0-9][a-z0-9-]{2,59}" value="'+esc(menuSettings?.slug||'')+'" placeholder="nomedaloja" required></label><p class="muted">Seu endereço: <strong id="menuAddress">'+esc(menuSettings?.slug||'nomedaloja')+'.pitacco.com.br</strong></p><label><input type="checkbox" name="enabled" '+(menuSettings?.enabled?'checked':'')+'> Ativar cardápio</label><label class="field">Taxa de entrega (R$)<input type="number" name="delivery_fee" min="0" max="1000" step="0.01" value="'+Number(menuSettings?.delivery_fee||0)+'"></label><div class="actions"><button class="btn">Salvar cardápio</button></div></form><p class="muted">A ativação pública exige DNS curinga, certificado HTTPS e roteamento configurados na hospedagem.</p></div></div>')}
async function publicPage(){const r=await db.from('public_menu_settings').select('store_id,slug,enabled,delivery_fee').eq('slug',slug).eq('enabled',true).maybeSingle();$('login').classList.add('hidden');$('publicMenu').classList.remove('hidden');const el=$('publicMenu');if(r.error||!r.data){el.innerHTML='<div class="public">'+notice('Cardápio indisponível.')+'</div>';return}const s=await db.from('stores').select('name,description').eq('id',r.data.store_id).single();const p=await db.from('products').select('id,name,description,price,image_url,category').eq('store_id',r.data.store_id).eq('menu_active',true);if(s.error||p.error){el.innerHTML='<div class="public">'+notice('Não foi possível carregar o cardápio. Verifique as permissões de leitura pública.',true)+'</div>';return}el.innerHTML='<div class="public"><h1>🛍 '+esc(s.data.name)+'</h1><p>'+esc(s.data.description||'Confira nosso cardápio')+'</p><h2>Produtos</h2><div class="products">'+(p.data||[]).map(x=>'<div class="card">'+(x.image_url?'<img class="productimg" src="'+esc(x.image_url)+'" alt="">':'<div class="productimg"></div>')+'<h3>'+esc(x.name)+'</h3><p class="muted">'+esc(x.description)+'</p><strong>'+money(x.price)+'</strong></div>').join('')+'</div>'+notice('Vitrine pública em preparação: o checkout ainda não está habilitado nesta versão.')+'</div>'}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMessage').textContent='Entrando...';const r=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error){$('loginMessage').textContent=errorText(r.error);return}await start()};
$('reset').onclick=async()=>{const email=$('email').value;if(!email){$('loginMessage').textContent='Informe seu e-mail primeiro.';return}const r=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin});$('loginMessage').textContent=r.error?errorText(r.error):'Se o e-mail estiver cadastrado, você receberá instruções.'};
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
$('mobilemenu').onclick=()=>$('sidebar').classList.toggle('open');
$('nav').onclick=e=>{const b=e.target.closest('[data-page]');if(b)show(b.dataset.page)};
$('content').onclick=async e=>{const go=e.target.closest('[data-go]');if(go)return show(go.dataset.go);if(e.target.closest('#reload'))return refresh();const order=e.target.closest('[data-order]');if(order){selected=order.dataset.order;return ordersPage()}if(e.target.closest('#accept')){const r=await db.from('orders').update({status:'accepted',accepted_at:new Date().toISOString(),accepted_by:user.id}).eq('id',selected).eq('store_id',store.id).eq('status','pending').select('id');if(r.error)return alert(errorText(r.error));if(!r.data?.length)return alert('Pedido já foi alterado. Atualize a lista.');return refresh()}const t=e.target.closest('[data-toggle]');if(t){const p=products.find(x=>x.id===t.dataset.toggle);const r=await db.from('products').update({menu_active:!p.menu_active}).eq('id',p.id).eq('store_id',store.id);if(r.error)return alert(errorText(r.error));return refresh()}};
$('content').oninput=e=>{if(e.target.name==='slug'){const a=$('menuAddress');if(a)a.textContent=e.target.value+'.pitacco.com.br'}};
$('content').onsubmit=async e=>{e.preventDefault();const f=e.target,d=new FormData(f);if(f.id==='productForm'){const payload={store_id:store.id,name:d.get('name'),category:d.get('category'),description:d.get('description'),price:Number(d.get('price')),cost:Number(d.get('cost')),image_url:d.get('image_url')||'',menu_active:d.has('menu_active')};const r=await db.from('products').insert(payload);if(r.error)return alert(errorText(r.error));return refresh()}if(f.id==='menuForm'){const slugValue=String(d.get('slug')).toLowerCase();if(reserved.has(slugValue))return alert('Esse endereço é reservado.');const payload={store_id:store.id,slug:slugValue,enabled:d.has('enabled'),delivery_fee:Number(d.get('delivery_fee')),payment_methods:menuSettings?.payment_methods||['dinheiro']};const r=await db.from('public_menu_settings').upsert(payload,{onConflict:'store_id'});if(r.error)return alert(errorText(r.error));alert('Configuração salva no Supabase. A publicação depende da configuração de domínio.');return refresh()}};
async function start(){const r=await db.auth.getUser();user=r.data.user;if(!user){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}try{await loadStore();await loadData();$('login').classList.add('hidden');$('app').classList.remove('hidden');show('dashboard')}catch(e){$('loginMessage').textContent=errorText(e);$('login').classList.remove('hidden');$('app').classList.add('hidden')}}
if(slug&&!reserved.has(slug))publicPage();else start();
</script></body></html>
