async function loadStore(){const {data:members,error:e}=await db.from('store_members').select('store_id,role').eq('user_id',user.id).limit(1);if(e)throw e;if(!members?.length)throw Error('Seu usuário ainda não está vinculado a uma loja. Solicite a vinculação ao administrador.');const r=await db.from('stores').select('*').eq('id',members[0].store_id).single();if(r.error)throw r.error;store=r.data;$('storeName').textContent=store.name;}

async function refresh(){if(refreshBusy||!store)return;refreshBusy=true;try{await loadData();show(page)}catch(e){console.error(e);alert('Falha ao atualizar: '+errorText(e))}finally{refreshBusy=false}}

integrations:{title:'Central de integrações',description:'Conexões oficiais com marketplaces, pagamentos e logística.',features:['iFood, 99Food e Keeta','PagBank, Mercado Pago, Stone, Asaas e Efí','Uber Direct e parceiros de entrega','Credenciais, webhooks e testes de conexão'],ready:false},

function reportsPage(){const totals={};const states={};let gross=0;for(const o of orders){const origin=String(o.source||'Próprio');if(!totals[origin])totals[origin]={count:0,gross:0};totals[origin].count++;totals[origin].gross+=Number(o.gross||0);states[String(o.status||'sem status')]=(states[String(o.status||'sem status')]||0)+1;gross+=Number(o.gross||0)}render('<h1 class="title">Relatórios de pedidos</h1><p class="muted">Dados dos últimos '+orders.length+' pedidos carregados (máximo 100). Valores brutos, sem descontar taxas ou custos.</p><div class="grid"><div class="card">Pedidos analisados<div class="metric">'+orders.length+'</div></div><div class="card">Faturamento bruto<div class="metric">'+money(gross)+'</div></div><div class="card">Origens<div class="metric">'+Object.keys(totals).length+'</div></div></div><div class="card"><h3>Vendas por origem</h3>'+Object.entries(totals).map(([k,v])=>'<p>'+esc(k)+': '+v.count+' pedidos — '+money(v.gross)+'</p>').join('')+'<h3>Pedidos por status</h3>'+Object.entries(states).map(([k,v])=>'<p>'+esc(k)+': '+v+'</p>').join('')+'<button class="btn" id="exportReport">Exportar pedidos CSV</button></div>')}
function exportReport(){const columns=['id','created_at','source','status','gross'];const csv=[columns.join(';'),...orders.map(o=>columns.map(k=>'"'+String(o[k]??'').replace(/"/g,'""').replace(/^[=+@-]/,"'")+'"').join(';'))].join('\\r\\n');const url=URL.createObjectURL(new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='pitacco-pedidos.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function kitchenPage(){const groups=[{title:'Aguardando aceite',statuses:['pending']},{title:'Em preparação',statuses:['accepted','preparing','in_preparation']},{title:'Prontos e expedição',statuses:['ready','dispatched','out_for_delivery']}];const used=new Set(groups.flatMap(g=>g.statuses));groups.push({title:'Outros estados',statuses:[]});const cells=groups.map((g,i)=>{const list=orders.filter(o=>i===3?!used.has(String(o.status)):g.statuses.includes(String(o.status)));return '<section class="card kitchen-column"><h3>'+esc(g.title)+' <span class="muted">('+list.length+')</span></h3>'+list.map(o=>'<article class="kitchen-ticket"><strong>Pedido #'+esc(String(o.id).slice(0,8))+'</strong><p>'+money(o.gross)+' · '+esc(o.source||o.channel||'Próprio')+'</p><p class="muted">'+new Date(o.created_at).toLocaleString('pt-BR')+' · '+esc(o.status)+'</p><button type="button" class="btn secondary" data-open-order="'+esc(o.id)+'">Ver pedido</button>'+(o.status==='pending'?'<button type="button" class="btn" data-accept-kitchen="'+esc(o.id)+'">Aceitar</button>':'')+'</article>').join('')+(list.length?'':'<p class="muted">Nenhum pedido nesta etapa.</p>')+'</section>'}).join('');render('<h1 class="title">Cozinha e produção</h1><p class="muted">Fila baseada nos últimos '+orders.length+' pedidos carregados (máximo 100). Atualize para consultar novos pedidos; este painel não controla impressoras nem conclui preparo automaticamente.</p><div class="actions"><button class="btn" id="reload">Atualizar fila</button></div><div class="kitchen-grid">'+cells+'</div>')}
function courierFinancePage(){const by={};for(const d of deliveries){const id=d.courier_id||'unassigned';if(!by[id])by[id]={count:0,fee:0,pay:0};by[id].count++;by[id].fee+=Number(d.delivery_fee||0);by[id].pay+=Number(d.courier_payment||0)}const rows=Object.entries(by).map(([id,v])=>{const c=couriers.find(c=>c.id===id);return '<tr><td>'+esc(c?.name||'Não atribuído')+'</td><td>'+v.count+'</td><td>'+money(v.fee)+'</td><td>'+money(v.pay)+'</td></tr>'}).join('');render('<h1 class="title">Acerto dos motoboys</h1><p class="muted">Resumo das '+deliveries.length+' entregas carregadas. Valores registrados, sem diárias ou pagamentos externos; não representa saldo final nem confirma quitação.</p><div class="card"><div class="actions"><button class="btn secondary" id="reload">Atualizar</button><button class="btn" id="exportCouriers">Exportar CSV</button></div><div style="overflow:auto"><table style="width:100%;text-align:left;border-spacing:12px"><thead><tr><th>Motoboy</th><th>Entregas</th><th>Taxas cobradas</th><th>Repasse registrado</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>')}
function exportCourierFinance(){const header=['motoboy','entregas','taxas_cobradas','repasse_registrado'];const by={};for(const d of deliveries){const id=d.courier_id||'unassigned';if(!by[id])by[id]={count:0,fee:0,pay:0};by[id].count++;by[id].fee+=Number(d.delivery_fee||0);by[id].pay+=Number(d.courier_payment||0)}const csv=[header.join(';'),...Object.entries(by).map(([id,v])=>[couriers.find(c=>c.id===id)?.name||'Não atribuído',v.count,v.fee.toFixed(2),v.pay.toFixed(2)].map(x=>'"'+String(x).replace(/"/g,'""').replace(/^[=+@-]/,"'")+'"').join(';'))].join('\\r\\n');const url=URL.createObjectURL(new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='pitacco-acerto-motoboys.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function cashDeskPage(){render('<h1 class="title">Caixa e movimentações</h1><p class="muted">Consultando sessões e movimentos reais da loja…</p>');const [a,b]=await Promise.all([db.from('pitacco_cash_sessions').select('*').eq('store_id',store.id).order('opened_at',{ascending:false}).limit(30),db.from('pitacco_cash_movements').select('*').eq('store_id',store.id).order('recorded_at',{ascending:false}).limit(100)]);if(a.error||b.error){render('<h1 class="title">Caixa e movimentações</h1>'+notice('Não foi possível consultar os registros: '+errorText(a.error||b.error),true));return}const sessions=a.data||[],moves=b.data||[],open=sessions.filter(x=>!x.closed_at),inTotal=moves.filter(x=>x.direction==='entrada').reduce((t,x)=>t+Number(x.amount||0),0),outTotal=moves.filter(x=>x.direction==='saida').reduce((t,x)=>t+Number(x.amount||0),0);const cashForms=open.length?'<div class="card"><h3>Movimentar caixa</h3><form id="cashMoveForm"><input type="hidden" name="session" value="'+esc(open[0].id)+'"><label>Tipo<select name="direction"><option value="entrada">Entrada</option><option value="saida">Saída</option></select></label><label>Valor (R$)<input type="number" name="amount" min="0.01" step="0.01" required></label><label>Motivo<input name="reason" minlength="3" maxlength="300" required></label><button class="btn" type="submit">Registrar movimentação</button></form><h3>Fechar caixa</h3><form id="cashCloseForm"><input type="hidden" name="session" value="'+esc(open[0].id)+'"><label>Dinheiro contado (R$)<input type="number" name="counted" min="0" step="0.01" required></label><label>Observação<input name="note" maxlength="500"></label><button class="btn" type="submit">Conferir e fechar caixa</button></form></div>':'<div class="card"><h3>Abrir caixa</h3><form id="cashOpenForm"><label>Valor inicial (R$)<input type="number" name="amount" min="0" step="0.01" value="0" required></label><button class="btn" type="submit">Abrir caixa</button></form></div>';
render('<h1 class="title">Caixa e movimentações</h1><p class="muted">Registros reais da loja: até 30 sessões e 100 movimentos recentes. Totais dos movimentos carregados, não uma DRE ou saldo bancário.</p><div class="grid"><div class="card">Caixas abertos<div class="metric">'+open.length+'</div></div><div class="card">Entradas registradas<div class="metric">'+money(inTotal)+'</div></div><div class="card">Saídas registradas<div class="metric">'+money(outTotal)+'</div></div></div><div class="card"><h3>Últimas sessões</h3>'+sessions.map(x=>'<p>'+esc(new Date(x.opened_at).toLocaleString('pt-BR'))+' · '+(x.closed_at?'Fechado':'Aberto')+' · Abertura '+money(x.opening_cash)+'</p>').join('')+'<h3>Movimentações</h3>'+moves.map(x=>'<p>'+esc(new Date(x.recorded_at).toLocaleString('pt-BR'))+' · '+esc(x.direction)+' · '+money(x.amount)+' · '+esc(x.reason||'')+'</p>').join('')+'</div>'+cashForms)}
async function courierRulesPage(){render('<h1 class="title">Regras e pagamentos dos motoboys</h1><p class="muted">Consultando regras e histórico…</p>');const [a,b,c]=await Promise.all([db.from('pitacco_courier_pay_rules').select('*').eq('store_id',store.id),db.from('pitacco_courier_daily_allowances').select('*').eq('store_id',store.id).order('work_date',{ascending:false}).limit(100),db.from('pitacco_courier_payouts').select('*').eq('store_id',store.id).order('created_at',{ascending:false}).limit(100)]);if(a.error||b.error||c.error){render(notice('Falha ao consultar regras e pagamentos: '+errorText(a.error||b.error||c.error),true));return}const rules=a.data||[],daily=b.data||[],payouts=c.data||[],courierName=id=>couriers.find(x=>x.id===id)?.name||'Entregador não identificado';render('<h1 class="title">Regras e pagamentos dos motoboys</h1><p class="muted">Configure regras de pagamento por entregador. Diárias e pagamentos abaixo são históricos reais; alterar a regra não recalcula valores já lançados.</p><div class="card"><h3>Configurar regra</h3><form id="courierRuleForm"><label>Entregador<select name="courier_id" required>'+couriers.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join('')+'</select></label><label>Modelo<select name="mode"><option value="per_delivery">Por entrega</option><option value="per_km">Por km</option><option value="daily">Diária</option><option value="customer_fee">Taxa cobrada do cliente</option><option value="mixed">Misto</option></select></label><label>Diária (R$)<input name="daily_rate" type="number" min="0" step="0.01" value="0" required></label><label>Por entrega (R$)<input name="per_delivery_rate" type="number" min="0" step="0.01" value="0" required></label><label>Por km (R$)<input name="km_rate" type="number" min="0" step="0.01" value="0" required></label><label>Taxa base (R$)<input name="rate" type="number" min="0" step="0.01" value="0" required></label><label><input type="checkbox" name="include_customer_fee"> Incluir function settingsPage(){const methods=menuSettings?.payment_methods||['dinheiro'];render('<h1 class="title">Configurações da loja</h1><div class="split"><div class="card"><h3>Identidade</h3><p><strong>'+esc(store.name)+'</strong></p><p class="muted">O logotipo e os dados da loja permanecem vinculados ao estabelecimento.</p></div><div class="card"><h3>Cardápio digital individual</h3><form id="menuForm"><label class="field">Endereço da loja<input name="slug" pattern="[a-z0-9][a-z0-9-]{2,59}" value="'+esc(menuSettings?.slug||'')+'" placeholder="nomedaloja" required></label><p class="muted">Seu endereço: <strong id="menuAddress">'+esc(menuSettings?.slug||'nomedaloja')+'.pitacco.com.br</strong></p><label><input type="checkbox" name="enabled" '+(menuSettings?.enabled?'checked':'')+'> Ativar cardápio</label><h4>Modalidades</h4><label class="field"><span><input type="checkbox" name="delivery_enabled" '+(menuSettings?.delivery_enabled!==false?'checked':'')+'> Entrega</span></label><label class="field"><span><input type="checkbox" name="pickup_enabled" '+(menuSettings?.pickup_enabled!==false?'checked':'')+'> Retirada</span></label><label class="field">Taxa de entrega (R$)<input type="number" name="delivery_fee" min="0" max="1000" step="0.01" value="'+Number(menuSettings?.delivery_fee||0)+'"></label><h4>Formas de pagamento</h4>'+[['dinheiro','Dinheiro'],['cartao_entrega','Cartão na entrega'],['pix_manual','Pix manual (conferência pela loja)']].map(([value,label])=>'<label class="field"><span><input type="checkbox" name="payment_methods" value="'+value+'" '+(methods.includes(value)?'checked':'')+'> '+label+'</span></label>').join('')+'<label class="field">Instruções para Pix manual<textarea name="pix_instructions" maxlength="1000">'+esc(menuSettings?.pix_instructions||'')+'</textarea></label><div class="actions"><button class="btn">Salvar cardápio</button></div></form><p class="muted">A ativação pública exige DNS curinga, certificado HTTPS e roteamento configurados na hospedagem.</p></div></div>')}
let publicCatalog=null,cart=[],checkoutRequestId=null,checkoutPayloadKey=null;
function renderPublic(){const host=$('publicMenu');const st=publicCatalog.store;const total=cart.reduce((sum,x)=>{const p=publicCatalog.products.find(p=>p.id===x.id);if(!p)return sum;const extra=(x.options||[]).reduce((a,id)=>a+(p.option_groups||[]).flatMap(g=>g.options||[]).filter(o=>o.id===id).reduce((v,o)=>v+Number(o.price||0),0),0);return sum+(Number(p.price)+extra)*x.qty},0);host.innerHTML='<div class="public"><div class="card" style="border-top:5px solid #f58025"><h1>🛍 '+esc(st.name)+'</h1><p class="muted">Faça seu pedido com segurança</p></div><div class="split" style="margin-top:16px"><section><h2>Cardápio</h2><div class="products">'+publicCatalog.products.map(p=>'<div class="card">'+(p.image_url?'<img class="productimg" src="'+esc(p.image_url)+'" alt="">':'')+'<h3>'+esc(p.name)+'</h3><p class="muted">'+esc(p.description)+'</p><strong>'+money(p.price)+'</strong><div class="actions"><button class="btn" data-add="'+esc(p.id)+'">Adicionar</button></div></div>').join('')+'</div></section><section class="card"><h2>Seu pedido</h2>'+cart.map((x,i)=>{const p=publicCatalog.products.find(p=>p.id===x.id);return '<div class="item"><strong>'+esc(p.name)+'</strong> · '+x.qty+' un. <button class="btn secondary" data-remove="'+i+'">Remover</button>'+(p.option_groups||[]).map(g=>'<label class="field">'+esc(g.name)+' (mín. '+g.min+', máx. '+g.max+')'+(g.options||[]).map(o=>'<label style="display:block;font-weight:400"><input type="checkbox" data-option="'+i+'" data-group="'+esc(g.id)+'" value="'+esc(o.id)+'" '+(x.options.includes(o.id)?'checked':'')+'> '+esc(o.name)+' +'+money(o.price)+'</label>').join('')+'</label>').join('')+'</div>'}).join('')+'<h3>Subtotal: '+money(total)+'</h3><p class="muted">Taxa de entrega: '+money(st.delivery_fee)+'</p><form id="checkoutForm"><label class="field">Nome completo<input name="customer" required minlength="2" maxlength="120"></label><label class="field">Telefone com DDD<input name="phone" required inputmode="tel" maxlength="30"></label><label class="field">Recebimento<select name="fulfillment">'+(st.delivery_enabled?'<option value="delivery">Entrega</option>':'')+(st.pickup_enabled?'<option value="pickup">Retirada</option>':'')+'</select></label><label class="field">Endereço de entrega<input name="address" maxlength="500" placeholder="Rua, número, bairro, referência"></label><label class="field">Pagamento<select name="payment">'+(st.payment_methods||[]).map(m=>'<option value="'+esc(m)+'">'+esc(({dinheiro:'Dinheiro',cartao_entrega:'Cartão na entrega',pix_manual:'Pix manual'})[m]||m)+'</option>').join('')+'</select></label><label class="field">Observações<textarea name="notes" maxlength="1000"></textarea></label><button class="btn" '+(!cart.length?'disabled':'')+'>Confirmar pedido</button></form><div id="checkoutMessage"></div></section></div></div>'}
async function publicPage(){ $('login').classList.add('hidden');$('publicMenu').classList.remove('hidden');const r=await db.rpc('get_public_menu',{p_slug:slug});if(r.error||!r.data){$('publicMenu').innerHTML='<div class="public">'+notice('Cardápio indisponível. '+(r.error?errorText(r.error):''),true)+'</div>';return}publicCatalog=r.data;cart=[];renderPublic()}
$('publicMenu').onclick=e=>{const add=e.target.closest('[data-add]');if(add){const p=publicCatalog.products.find(p=>p.id===add.dataset.add);if(!p)return;const old=cart.find(x=>x.id===p.id);if(old)old.qty=Math.min(20,old.qty+1);else cart.push({id:p.id,qty:1,options:[]});checkoutRequestId=null;checkoutPayloadKey=null;renderPublic();return}const rem=e.target.closest('[data-remove]');if(rem){cart.splice(Number(rem.dataset.remove),1);checkoutRequestId=null;checkoutPayloadKey=null;renderPublic()}};
$('publicMenu').onchange=e=>{if(!e.target.matches('[data-option]'))return;const i=Number(e.target.dataset.option),x=cart[i],p=publicCatalog.products.find(p=>p.id===x.id),g=p.option_groups.find(g=>g.id===e.target.dataset.group);if(e.target.checked){const chosen=x.options.filter(id=>g.options.some(o=>o.id===id));if(chosen.length>=g.max){e.target.checked=false;alert('Limite de complementos atingido.');return}x.options.push(e.target.value)}else x.options=x.options.filter(id=>id!==e.target.value);checkoutRequestId=null;checkoutPayloadKey=null};
$('publicMenu').onsubmit=async e=>{if(e.target.id!=='checkoutForm')return;e.preventDefault();if(!cart.length)return;for(const x of cart){const p=publicCatalog.products.find(p=>p.id===x.id);for(const g of p.option_groups||[]){const n=x.options.filter(id=>(g.options||[]).some(o=>o.id===id)).length;if(n<g.min||n>g.max){$('checkoutMessage').innerHTML=notice('Confira os complementos de '+p.name+': '+g.name,true);return}}}const form=e.target,d=new FormData(form),button=form.querySelector('button[type=submit],button.btn');button.disabled=true;const payload={p_slug:slug,p_request:null,p_customer:d.get('customer'),p_phone:d.get('phone'),p_address:d.get('address')||'',p_items:cart.map(x=>({product_id:x.id,quantity:x.qty,options:x.options})),p_fulfillment:d.get('fulfillment'),p_payment:d.get('payment'),p_notes:d.get('notes')||''};const key=JSON.stringify(payload);if(!checkoutRequestId||checkoutPayloadKey!==key){checkoutRequestId=crypto.randomUUID();checkoutPayloadKey=key}payload.p_request=checkoutRequestId;const result=await db.rpc('checkout_public_order',payload);if(result.error){$('checkoutMessage').innerHTML=notice(errorText(result.error),true);button.disabled=false;return}const o=result.data;cart=[];checkoutRequestId=null;checkoutPayloadKey=null;const el=$('publicMenu');el.innerHTML='<div class="public"><div class="card"><h1>Pedido recebido! 🎉</h1><p>Pedido: <strong>'+esc(o.order_id)+'</strong></p><p>Total: <strong>'+money(o.total)+'</strong></p><p>Status: '+esc(o.status)+'</p>'+(o.payment_instructions?'<p>Instruções de pagamento: '+esc(o.payment_instructions)+'</p>':'')+'<p class="muted">O pagamento manual permanece pendente até conferência da loja.</p><button class="btn" id="newPublicOrder">Novo pedido</button></div></div>';el.onclick=()=>publicPage()};
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMessage').textContent='Entrando...';const r=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error){$('loginMessage').textContent=errorText(r.error);return}await start()};
$('reset').onclick=async()=>{const email=$('email').value;if(!email){$('loginMessage').textContent='Informe seu e-mail primeiro.';return}const r=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin});$('loginMessage').textContent=r.error?errorText(r.error):'Se o e-mail estiver cadastrado, você receberá instruções.'};
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
$('mobilemenu').onclick=()=>$('sidebar').classList.toggle('open');
$('nav').onclick=e=>{const b=e.target.closest('[data-page]');if(b)show(b.dataset.page)};
$('content').onclick=async e=>{const go=e.target.closest('[data-go]');if(go)return show(go.dataset.go);if(e.target.closest('#reload'))return refresh();if(e.target.closest('#exportReport'))return exportReport();if(e.target.closest('#exportCouriers'))return exportCourierFinance();const openOrder=e.target.closest('[data-open-order]');if(openOrder){selected=openOrder.dataset.openOrder;return show('orders')}const kitchenAccept=e.target.closest('[data-accept-kitchen]');if(kitchenAccept){const r=await db.rpc('accept_order',{p_order:kitchenAccept.dataset.acceptKitchen});if(r.error)return alert(errorText(r.error));return refresh()}const order=e.target.closest('[data-order]');if(order){selected=order.dataset.order;return ordersPage()}if(e.target.closest('#accept')){const r=await db.rpc('accept_order',{p_order:selected});if(r.error)return alert(errorText(r.error));return refresh()}if(e.target.closest('#cancelProduct')){editingProduct=null;return productsPage()}const ep=e.target.closest('[data-edit-product]');if(ep){editingProduct=ep.dataset.editProduct;return productsPage()}const eg=e.target.closest('[data-edit-group]');if(eg){const g=optionGroups.find(g=>g.id===eg.dataset.editGroup);const name=prompt('Nome do grupo',g.name);if(name===null)return;const min=prompt('Mínimo de escolhas',g.min_select);if(min===null)return;const max=prompt('Máximo de escolhas',g.max_select);if(max===null)return;const r=await db.rpc('pitacco_save_option_group',{p_store_id:store.id,p_product_id:g.product_id,p_group_id:g.id,p_name:name,p_min:Number(min),p_max:Number(max)});if(r.error)return alert(errorText(r.error));return refresh()}const eo=e.target.closest('[data-edit-option]');if(eo){const o=productOptions.find(o=>o.id===eo.dataset.editOption);const name=prompt('Nome do complemento',o.name);if(name===null)return;const price=prompt('Preço adicional (R$)',o.additional_price);if(price===null)return;const available=confirm('Este complemento deve ficar disponível no cardápio?');const r=await db.rpc('pitacco_save_option',{p_store_id:store.id,p_group_id:o.group_id,p_option_id:o.id,p_name:name,p_price:Number(price),p_available:available});if(r.error)return alert(errorText(r.error));return refresh()}const assign=e.target.closest('[data-assign]');if(assign){const courierId=$('courier-'+assign.dataset.assign)?.value;if(!courierId)return alert('Escolha um motoboy.');const r=await db.rpc('assign_order_courier',{p_delivery:assign.dataset.assign,p_courier:courierId,p_confirm_deviation:false});if(r.error)return alert(errorText(r.error));return refresh()}const t=e.target.closest('[data-toggle]');if(t){const p=products.find(x=>x.id===t.dataset.toggle);const r=await db.from('products').update({menu_active:!p.menu_active}).eq('id',p.id).eq('store_id',store.id);if(r.error)return alert(errorText(r.error));return refresh()}};
$('content').oninput=e=>{if(e.target.name==='slug'){const a=$('menuAddress');if(a)a.textContent=e.target.value+'.pitacco.com.br'}};
$('content').onsubmit=async e=>{e.preventDefault();const f=e.target,d=new FormData(f);if(['cashOpenForm','cashMoveForm','cashCloseForm','courierPayoutForm'].includes(f.id)){const btn=f.querySelector('[type="submit"]');if(btn?.disabled)return;const amount=Number(d.get('amount'));if(f.id!=='cashCloseForm'&&(!Number.isFinite(amount)||amount<0||Math.round(amount*100)!==amount*100))return alert('Informe um valor válido em reais.');if(btn)btn.disabled=true;try{let r;if(f.id==='cashOpenForm')r=await db.rpc('pitacco_cash_open',{p_store:store.id,p_amount:amount});if(f.id==='cashMoveForm'){const direction=String(d.get('direction'));if(!['entrada','saida'].includes(direction)||amount<=0||String(d.get('reason')||'').trim().length<3)return alert('Movimentação inválida.');r=await db.rpc('pitacco_cash_move',{p_session:d.get('session'),p_request:crypto.randomUUID(),p_direction:direction,p_amount:amount,p_reason:String(d.get('reason')).trim()})}if(f.id==='cashCloseForm'){const counted=Number(d.get('counted'));if(!Number.isFinite(counted)||counted<0)return alert('Conferência inválida.');if(!confirm('Confirmar fechamento do caixa? Esta operação não pode ser desfeita pelo painel.'))return;r=await db.rpc('pitacco_cash_close',{p_session:d.get('session'),p_counted:counted,p_note:d.get('note')||''})}if(f.id==='courierPayoutForm'){if(!confirm('Confirma que este pagamento já foi realizado?'))return;r=await db.rpc('pitacco_register_courier_payout',{p_store:store.id,p_courier:d.get('courier_id'),p_start:d.get('start'),p_end:d.get('end'),p_amount:amount,p_note:d.get('note')||''})}if(r.error)return alert(errorText(r.error));if(f.id==='cashCloseForm')alert('Caixa fechado. Resultado: '+JSON.stringify(r.data));return f.id==='courierPayoutForm'?courierRulesPage():cashDeskPage()}catch(ex){alert(errorText(ex))}finally{if(btn)btn.disabled=false}return}if(f.id==='courierRuleForm'){const courierId=String(d.get('courier_id')||'');if(!couriers.some(c=>c.id===courierId))return alert('Escolha um entregador válido.');const mode=String(d.get('mode')||'');if(!['per_delivery','per_km','daily','customer_fee','mixed'].includes(mode))return alert('Modelo inválido.');const values={};for(const k of ['daily_rate','per_delivery_rate','km_rate','rate']){const n=Number(d.get(k));if(!Number.isFinite(n)||n<0)return alert('Informe valores válidos.');values[k]=n}const payload={store_id:store.id,courier_id:courierId,mode,...values,include_customer_fee:d.has('include_customer_fee')};const r=await db.from('pitacco_courier_pay_rules').upsert(payload,{onConflict:'store_id,courier_id'});if(r.error)return alert(errorText(r.error));return courierRulesPage()}if(f.id==='groupForm'){if(!editingProduct)return alert('Selecione um produto.');const r=await db.rpc('pitacco_save_option_group',{p_store_id:store.id,p_product_id:editingProduct,p_group_id:null,p_name:d.get('name'),p_min:Number(d.get('min')),p_max:Number(d.get('max'))});if(r.error)return alert(errorText(r.error));return refresh()}if(f.classList.contains('optionForm')){const r=await db.rpc('pitacco_save_option',{p_store_id:store.id,p_group_id:f.dataset.groupId,p_option_id:null,p_name:d.get('name'),p_price:Number(d.get('price')),p_available:true});if(r.error)return alert(errorText(r.error));return refresh()}if(f.id==='productForm'){const payload={p_store_id:store.id,p_product_id:editingProduct,p_name:d.get('name'),p_category:d.get('category'),p_description:d.get('description'),p_price:Number(d.get('price')),p_cost:Number(d.get('cost')),p_menu_active:d.has('menu_active')};const r=await db.rpc('pitacco_save_product',payload);if(r.error)return alert(errorText(r.error));editingProduct=r.data;return refresh()}if(f.id==='menuForm'){const slugValue=String(d.get('slug')).toLowerCase();if(reserved.has(slugValue))return alert('Esse endereço é reservado.');const methods=d.getAll('payment_methods');if(!methods.length)return alert('Escolha ao menos uma forma de pagamento.');if(!d.has('delivery_enabled')&&!d.has('pickup_enabled'))return alert('Habilite entrega ou retirada.');const pix=String(d.get('pix_instructions')||'');if(methods.includes('pix_manual')&&pix.trim().length<3)return alert('Informe as instruções para Pix manual.');const payload={store_id:store.id,slug:slugValue,enabled:d.has('enabled'),delivery_enabled:d.has('delivery_enabled'),pickup_enabled:d.has('pickup_enabled'),delivery_fee:Number(d.get('delivery_fee')),payment_methods:methods,pix_instructions:pix};const r=await db.rpc('save_public_menu_settings',{p_store:store.id,p_slug:slugValue,p_enabled:payload.enabled,p_delivery_enabled:payload.delivery_enabled,p_pickup_enabled:payload.pickup_enabled,p_delivery_fee:payload.delivery_fee,p_payment_methods:payload.payment_methods,p_pix_instructions:payload.pix_instructions});if(r.error)return alert(errorText(r.error));alert('Configuração salva no Supabase. A publicação depende da configuração de domínio.');return refresh()}};
function subscribeStore(){if(liveChannel)db.removeChannel(liveChannel);liveChannel=db.channel('pitacco-store-'+store.id).on('postgres_changes',{event:'*',schema:'public',table:'orders',filter:'store_id=eq.'+store.id},()=>refresh()).on('postgres_changes',{event:'*',schema:'public',table:'deliveries',filter:'store_id=eq.'+store.id},()=>refresh()).subscribe()}
async function start(){const r=await db.auth.getUser();user=r.data.user;if(!user){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}try{await loadStore();await loadData();$('login').classList.add('hidden');$('app').classList.remove('hidden');show('dashboard');subscribeStore()}catch(e){$('loginMessage').textContent=errorText(e);$('login').classList.remove('hidden');$('app').classList.add('hidden')}}
if(slug&&!reserved.has(slug))publicPage();else start();
</script></body></html>
