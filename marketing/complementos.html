<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complementos | Pitacco</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8f4;color:#29201c;font:15px system-ui,sans-serif}header,main{max-width:900px;margin:auto;padding:22px}header a{color:#e94d35;font-weight:900;font-size:23px;text-decoration:none}main{background:white;border:1px solid #eadbd1;border-radius:18px;margin:20px auto;padding:30px}p{color:#78695f;line-height:1.6}label{display:block;font-weight:700;margin:12px 0 6px}input,select{width:100%;padding:11px;border:1px solid #ddd0c6;border-radius:9px;font:inherit}input[type=checkbox]{width:auto}button{background:#e94d35;color:white;border:0;border-radius:9px;padding:12px 18px;font-weight:800;cursor:pointer}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}fieldset{border:1px solid #eadbd1;border-radius:12px;padding:17px;margin:20px 0}legend{font-weight:900}.msg{background:#fff0e7;padding:12px;border-radius:10px;margin:15px 0}.group{border:1px solid #e9d9ce;padding:16px;border-radius:12px;margin:14px 0}.group h3{margin:0 0 7px}.option{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #eee;padding:9px 0}.secondary{background:#f4e8e0;color:#a64230}.actions{display:flex;gap:8px;flex-wrap:wrap}small{color:#73685e}@media(max-width:650px){.grid{grid-template-columns:1fr}main{margin:10px;padding:18px}}</style></head><body><header><a href="/">⌖ Pitacco</a></header><main><h1>Complementos e adicionais</h1><p>Configure grupos de escolhas por produto. Exemplo: até 3 frutas grátis e até 2 coberturas pagas. O cardápio não será publicado automaticamente.</p><div id="msg" class="msg" role="status">Verificando acesso…</div><div id="content" hidden><div class="grid"><div><label for="store">Loja</label><select id="store"></select></div><div><label for="product">Produto</label><select id="product"></select></div></div><fieldset><legend id="groupTitle">Novo grupo</legend><form id="groupForm"><label for="groupName">Nome do grupo</label><input id="groupName" required minlength="2" maxlength="100" placeholder="Ex.: Escolha até 3 frutas"><label for="requirement">Obrigatoriedade do grupo</label><select id="requirement"><option value="optional">Opcional — cliente pode não escolher</option><option value="required">Obrigatório — cliente deve escolher</option></select><div class="grid"><div><label for="minimum">Mínimo de escolhas</label><input id="minimum" type="number" min="0" max="100" value="0" required></div><div><label for="maximum">Máximo de escolhas</label><input id="maximum" type="number" min="1" max="100" value="1" required></div></div><p><button id="saveGroup">Salvar grupo</button> <button class="secondary" id="resetGroup" type="button">Novo grupo</button></p></form></fieldset><h2>Grupos do produto</h2><div id="groups"></div><fieldset id="optionSection" hidden><legend id="optionTitle">Adicionar opção</legend><form id="optionForm"><label for="optionGroup">Grupo</label><select id="optionGroup"></select><label for="optionName">Nome da opção</label><input id="optionName" required maxlength="100" placeholder="Ex.: Morango"><div class="grid"><div><label for="optionPrice">Valor adicional (R$)</label><input id="optionPrice" type="number" min="0" max="100000" step=".01" value="0" required></div><div><label><input id="optionAvailable" type="checkbox" checked> Opção disponível</label></div></div><p><button id="saveOption">Salvar opção</button> <button id="resetOption" type="button" class="secondary">Nova opção</button></p></form></fieldset><p><a href="/produtos/">← Voltar aos produtos</a> · <a href="/app/">Painel</a></p></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const client=createClient('https://mdevzehqcpcgxspwbiyz.supabase.co','sb_publishable_JLIp1y5II26GrztrKDNIyQ_ryETrCuj');const $=id=>document.getElementById(id);let groups=[],editingGroup=null,editingOption=null;function msg(s){$('msg').textContent=s}function resetGroup(){editingGroup=null;$('requirement').value='optional';$('groupForm').reset();$('minimum').value=0;$('maximum').value=1;$('groupTitle').textContent='Novo grupo'}function resetOption(){editingOption=null;$('optionForm').reset();$('optionPrice').value=0;$('optionAvailable').checked=true;$('optionTitle').textContent='Adicionar opção'}$('resetGroup').onclick=resetGroup;$('requirement').addEventListener('change',()=>{if($('requirement').value==='optional')$('minimum').value=0;else if(Number($('minimum').value)<1)$('minimum').value=1});$('minimum').addEventListener('input',()=>{$('requirement').value=Number($('minimum').value)>0?'required':'optional'});$('resetOption').onclick=resetOption;function chooseOption(g,o){editingOption=o.id;$('optionGroup').value=g.id;$('optionName').value=o.name;$('optionPrice').value=o.price;$('optionAvailable').checked=o.available;$('optionTitle').textContent='Editar opção';$('optionSection').scrollIntoView({behavior:'smooth'})}async function loadGroups(){const{data,error}=await client.rpc('pitacco_list_complements',{p_store_id:$('store').value,p_product_id:$('product').value});if(error)throw error;groups=data||[];$('groups').replaceChildren();$('optionGroup').replaceChildren();$('optionSection').hidden=!groups.length;for(const g of groups){const opt=document.createElement('option');opt.value=g.id;opt.textContent=g.name;$('optionGroup').append(opt);const box=document.createElement('section');box.className='group';const h=document.createElement('h3');h.textContent=g.name;box.append(h);const sub=document.createElement('p');sub.textContent=(g.min>0?'Obrigatório':'Opcional')+' · Escolhas: mínimo '+g.min+' · máximo '+g.max;box.append(sub);const edit=document.createElement('button');edit.type='button';edit.className='secondary';edit.textContent='Editar grupo';edit.onclick=()=>{editingGroup=g.id;$('groupName').value=g.name;$('minimum').value=g.min;$('maximum').value=g.max;$('requirement').value=g.min>0?'required':'optional';$('groupTitle').textContent='Editar grupo';$('groupForm').scrollIntoView({behavior:'smooth'})};box.append(edit);for(const o of g.options){const line=document.createElement('div');line.className='option';const span=document.createElement('span');span.textContent=o.name+' · '+new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(o.price)+(o.available?'':' (indisponível)');line.append(span);const b=document.createElement('button');b.className='secondary';b.textContent='Editar';b.type='button';b.onclick=()=>chooseOption(g,o);line.append(b);box.append(line)}const add=document.createElement('button');add.type='button';add.textContent='Adicionar opção';add.onclick=()=>{resetOption();$('optionGroup').value=g.id;$('optionSection').scrollIntoView({behavior:'smooth'})};box.append(add);$('groups').append(box)}if(!groups.length){const p=document.createElement('p');p.textContent='Nenhum grupo cadastrado para este produto.';$('groups').append(p)}msg('Complementos carregados.')}async function loadProducts(){resetGroup();resetOption();const{data,error}=await client.rpc('pitacco_list_products',{p_store_id:$('store').value});if(error)throw error;$('product').replaceChildren();for(const p of data||[]){const option=document.createElement('option');option.value=p.id;option.textContent=p.name;$('product').append(option)}const requested=new URLSearchParams(location.search).get('produto');if(requested&&[...$('product').options].some(x=>x.value===requested))$('product').value=requested;if(!$('product').value){$('groups').textContent='Cadastre um produto primeiro.';$('groupForm').hidden=true;$('optionSection').hidden=true;return}$('groupForm').hidden=false;await loadGroups()}async function init(){const{data:{user}}=await client.auth.getUser();if(!user){msg('Entre na sua conta para continuar.');return}const{data:members,error}=await client.from('store_members').select('store_id,role').eq('user_id',user.id);if(error)throw error;const ids=(members||[]).filter(m=>['lojista','gestor'].includes(m.role)).map(m=>m.store_id);if(!ids.length){msg('Cadastre sua loja primeiro.');return}const{data:stores,error:storeError}=await client.from('stores').select('id,name').in('id',ids);if(storeError)throw storeError;for(const s of stores||[]){const option=document.createElement('option');option.value=s.id;option.textContent=s.name;$('store').append(option)}if(!$('store').value){msg('Nenhuma loja disponível.');return}$('content').hidden=false;await loadProducts()}$('store').onchange=()=>loadProducts().catch(e=>msg(e.message));$('product').onchange=()=>{resetGroup();resetOption();loadGroups().catch(e=>msg(e.message))};$('groupForm').onsubmit=async e=>{e.preventDefault();$('saveGroup').disabled=true;try{const{error}=await client.rpc('pitacco_save_option_group',{p_store_id:$('store').value,p_product_id:$('product').value,p_group_id:editingGroup,p_name:$('groupName').value,p_min:$('requirement').value==='optional'?0:Math.max(1,Number($('minimum').value)),p_max:Number($('maximum').value)});if(error)throw error;resetGroup();await loadGroups();msg('Grupo salvo com sucesso.')}catch(err){msg('Erro ao salvar grupo: '+err.message)}finally{$('saveGroup').disabled=false}};$('optionForm').onsubmit=async e=>{e.preventDefault();$('saveOption').disabled=true;try{const{error}=await client.rpc('pitacco_save_option',{p_store_id:$('store').value,p_group_id:$('optionGroup').value,p_option_id:editingOption,p_name:$('optionName').value,p_price:Number($('optionPrice').value),p_available:$('optionAvailable').checked});if(error)throw error;resetOption();await loadGroups();msg('Opção salva com sucesso.')}catch(err){msg('Erro ao salvar opção: '+err.message)}finally{$('saveOption').disabled=false}};init().catch(e=>msg('Falha ao carregar: '+e.message));</script></body></html>
