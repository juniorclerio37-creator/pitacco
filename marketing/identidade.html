<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Identidade visual da loja | Painel</title><style>body{margin:0;background:#f6f7f9;color:#252525;font:16px system-ui}main{max-width:650px;margin:40px auto;padding:20px}section{background:white;border:1px solid #e5e5e5;border-radius:18px;padding:25px}h1{margin-top:0}label{display:block;margin:20px 0 8px;font-weight:700}input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;box-sizing:border-box;font:inherit}input[type=color]{height:60px;padding:5px}button{border:0;border-radius:11px;padding:14px 20px;background:#d63e2c;color:white;font-weight:800;cursor:pointer;margin-top:20px}button:disabled{opacity:.5}.hint{color:#676767;font-size:14px}.preview{border:1px solid #eee;border-radius:12px;padding:18px;display:flex;align-items:center;gap:12px;margin-top:22px}.preview img{width:64px;height:64px;object-fit:cover;border-radius:12px}.preview strong{font-size:22px}#message{margin-top:15px}</style></head><body><main><section><h1>Identidade visual da loja</h1><p class="hint">Personalize o que seus clientes veem no cardápio e no acompanhamento do pedido.</p><form id="form"><label for="store">ID da loja</label><input id="store" required placeholder="ID da sua loja" autocomplete="off"><label for="name">Nome de exibição (prévia)</label><input id="name" placeholder="Nome da loja" readonly><label for="logo">Endereço HTTPS do logotipo</label><input id="logo" type="url" placeholder="https://.../logo.png"><p class="hint">O arquivo deve estar hospedado em endereço público HTTPS.</p><label for="color">Cor principal da loja</label><input id="color" type="color" value="#db482f"><div class="preview"><img id="previewLogo" hidden alt="Prévia do logotipo"><strong id="previewName">Sua loja</strong></div><button type="submit">Salvar identidade visual</button></form><p id="message" role="status"></p></section></main><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const client=createClient('https://mdevzehqcpcgxspwbiyz.supabase.co','sb_publishable_JLIp1y5II26GrztrKDNIyQ_ryETrCuj');const $=id=>document.getElementById(id);$('store').value=new URLSearchParams(location.search).get('loja_id')||'';$('logo').oninput=()=>{const v=$('logo').value;$('previewLogo').hidden=!/^https:\/\//.test(v);if(!$('previewLogo').hidden)$('previewLogo').src=v};$('color').oninput=()=>{$('previewName').style.color=$('color').value};$('store').onchange=async()=>{const id=$('store').value;if(!/^[0-9a-f-]{36}$/i.test(id))return;const{data,error}=await client.from('stores').select('name').eq('id',id).maybeSingle();if(!error&&data){$('name').value=data.name;$('previewName').textContent=data.name}};$('store').dispatchEvent(new Event('change'));$('form').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;$('message').textContent='Salvando…';try{const{data:{session}}=await client.auth.getSession();if(!session)throw Error('Faça login no painel da loja antes de salvar.');const{data,error}=await client.rpc('pitacco_save_customer_branding',{p_store_id:$('store').value,p_logo_url:$('logo').value.trim()||null,p_primary_color:$('color').value});if(error)throw error;if(!data)throw Error('Não foi possível salvar.');$('message').textContent='Identidade visual salva com sucesso.'}catch(err){$('message').textContent=err.message}finally{button.disabled=false}};</script></body></html>
