<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Identidade visual da loja | Painel</title><style>body{margin:0;background:#f6f7f9;color:#252525;font:16px system-ui}main{max-width:650px;margin:40px auto;padding:20px}section{background:white;border:1px solid #e5e5e5;border-radius:18px;padding:25px}h1{margin-top:0}label{display:block;margin:20px 0 8px;font-weight:700}input,select{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;box-sizing:border-box;font:inherit}input[type=color]{height:60px;padding:5px}button{border:0;border-radius:11px;padding:14px 20px;background:#d63e2c;color:white;font-weight:800;cursor:pointer;margin-top:20px}button:disabled{opacity:.5}.hint{color:#676767;font-size:14px}.preview{border:1px solid #eee;border-radius:12px;padding:18px;display:flex;align-items:center;gap:12px;margin-top:22px}.preview img{width:64px;height:64px;object-fit:cover;border-radius:12px}.preview strong{font-size:22px}#message{margin-top:15px}</style></head><body><main><section><h1>Identidade visual da loja</h1><p class="hint">Personalize o que seus clientes veem no cardápio e no acompanhamento do pedido.</p><form id="form"><label for="store">Estabelecimento</label><select id="store" required disabled><option value="">Carregando suas lojas…</option></select><label for="name">Nome de exibição (prévia)</label><input id="name" placeholder="Nome da loja" readonly><label for="logo">Endereço HTTPS do logotipo</label><input id="logo" type="url" placeholder="https://.../logo.png"><p class="hint">O arquivo deve estar hospedado em endereço público HTTPS.</p><label for="color">Cor principal da loja</label><input id="color" type="color" value="#db482f"><div class="preview"><img id="previewLogo" hidden alt="Prévia do logotipo"><strong id="previewName">Sua loja</strong></div><button type="submit">Salvar identidade visual</button></form><p id="message" role="status"></p><p id="loginHelp" class="hint" hidden>Faça login no painel do estabelecimento e volte a esta página.</p></section></main><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const client=createClient('https://mdevzehqcpcgxspwbiyz.supabase.co','sb_publishable_JLIp1y5II26GrztrKDNIyQ_ryETrCuj');const $=id=>document.getElementById(id);
let stores=[];
function preview(){const v=$('logo').value;$('previewLogo').hidden=!/^https:\/\//.test(v);if(!$('previewLogo').hidden)$('previewLogo').src=v;$('previewName').style.color=$('color').value}
$('logo').oninput=preview;$('color').oninput=preview;
function selectStore(id){const s=stores.find(x=>x.store_id===id);if(!s)return;$('name').value=s.store_name;$('previewName').textContent=s.store_name;$('logo').value=s.logo_url||'';$('color').value=s.primary_color||'#db482f';preview()}
$('store').onchange=()=>selectStore($('store').value);
async function load(){try{const{data:{session}}=await client.auth.getSession();if(!session){$('message').textContent='É necessário entrar no painel da loja.';$('loginHelp').hidden=false;return}const{data,error}=await client.rpc('pitacco_my_store_branding');if(error)throw error;stores=data||[];if(!stores.length){$('message').textContent='Sua conta não possui lojas autorizadas para configurar.';return}const sel=$('store');sel.replaceChildren();for(const s of stores){const opt=document.createElement('option');opt.value=s.store_id;opt.textContent=s.store_name;sel.append(opt)}sel.disabled=false;const wanted=new URLSearchParams(location.search).get('loja_id');if(wanted&&stores.some(s=>s.store_id===wanted))sel.value=wanted;selectStore(sel.value);$('message').textContent='Selecione a loja e personalize a identidade visual.'}catch(e){$('message').textContent='Não foi possível carregar suas lojas: '+e.message}}
$('form').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;$('message').textContent='Salvando…';try{if(!stores.some(s=>s.store_id===$('store').value))throw Error('Loja não autorizada.');const{data,error}=await client.rpc('pitacco_save_customer_branding',{p_store_id:$('store').value,p_logo_url:$('logo').value.trim()||null,p_primary_color:$('color').value});if(error)throw error;if(!data)throw Error('Não foi possível salvar.');const saved=stores.find(s=>s.store_id===$('store').value);saved.logo_url=$('logo').value.trim()||null;saved.primary_color=$('color').value;$('message').textContent='Identidade visual salva com sucesso.'}catch(err){$('message').textContent=err.message}finally{button.disabled=false}};
load();</script></body></html>
