<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cardápio</title><style>*{box-sizing:border-box}body{margin:0;background:#fff9f5;color:#30251f;font:15px system-ui,sans-serif}header,main{max-width:940px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center}header a{color:var(--brand,#db482f);text-decoration:none;font-weight:900;font-size:24px}.layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(290px,1fr);gap:22px}.panel{background:#fff;border:1px solid #eadbd2;border-radius:17px;padding:23px;margin-bottom:18px}h1{margin:5px 0}h2{font-size:20px}h3{margin:0 0 6px}.muted,small{color:#776960}.product{padding:18px 0;border-bottom:1px solid #eee1d8}.product:last-child{border:0}.options{margin:12px 0;padding:13px;background:#fff9f5;border-radius:10px}.options h4{margin:0 0 5px}.option{display:flex;align-items:center;gap:9px;margin:9px 0}.option input{width:auto}.option span{margin-left:auto}input,select,textarea{width:100%;padding:11px;border:1px solid #d9c9be;border-radius:9px;font:inherit}label{display:block;margin:12px 0 6px;font-weight:700}button{background:var(--brand,#e74d34);color:white;border:0;border-radius:9px;padding:12px 18px;font-weight:800;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#f3e7e0;color:#923a2b}.actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:13px}.msg{background:#fff0e5;padding:14px;border-radius:11px;margin-bottom:15px;white-space:pre-wrap}.cartline{border-bottom:1px solid #eee1d8;padding:10px 0}.cartline small{display:block;margin-top:4px}.total{font-size:22px;font-weight:900;display:flex;justify-content:space-between;margin:16px 0}.required{color:#bc3e2d;font-size:12px}.price{font-weight:900;color:var(--brand,#c83e28)}@media(max-width:760px){.layout{grid-template-columns:1fr}main{padding:12px}.panel{padding:17px}}</style></head><body><header><div style="display:flex;align-items:center;gap:12px"><img id="storeLogo" hidden alt="Logo da loja" style="width:48px;height:48px;border-radius:12px;object-fit:cover"><strong id="headerStoreName" style="font-size:22px"></strong></div><span>Cardápio digital</span></header><main><div id="msg" class="msg" role="status">Carregando cardápio…</div><h1 id="storeName"></h1><p class="muted">Escolha seus produtos e complementos antes de finalizar.</p><div class="layout" id="layout" hidden><section><div class="panel"><h2>Produtos</h2><div id="products"></div></div></section><aside><div class="panel"><h2>Seu pedido</h2><div id="cart">Seu carrinho está vazio.</div><div id="total" class="total"></div><form id="checkout"><h3>Finalizar pedido</h3><label for="customer">Seu nome</label><input id="customer" required minlength="2" maxlength="120"><label for="phone">Telefone com DDD</label><input id="phone" required inputmode="tel" maxlength="30"><label for="fulfillment">Como deseja receber?</label><select id="fulfillment"></select><div id="addressBlock"><label for="address">Endereço de entrega</label><textarea id="address" rows="2" maxlength="500"></textarea></div><label for="payment">Forma de pagamento</label><select id="payment" required></select><label for="notes">Observações</label><textarea id="notes" maxlength="1000" rows="2"></textarea><p><button id="send" type="submit">Confirmar pedido</button></p></form><div id="success" hidden></div></div></aside></div></main><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const client=createClient('https://mdevzehqcpcgxspwbiyz.supabase.co','sb_publishable_JLIp1y5II26GrztrKDNIyQ_ryETrCuj');
const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0);
const slug=new URLSearchParams(location.search).get('loja')||location.pathname.split('/').filter(Boolean)[1]||'';
let menu,cart=[],requestId=crypto.randomUUID();
function msg(t){$('msg').textContent=t}
function el(tag,txt,cls){const x=document.createElement(tag);if(txt!==undefined)x.textContent=txt;if(cls)x.className=cls;return x}
function selectedFor(group,container){return [...container.querySelectorAll('input[type=checkbox]:checked')].filter(x=>x.dataset.group===group.id).map(x=>x.value)}
function renderProducts(){const root=$('products');root.replaceChildren();for(const p of menu.products){const section=el('article',undefined,'product');section.append(el('h3',p.name),el('p',p.description||'', 'muted'),el('strong',money(p.price),'price'));const optionsBox=el('div');for(const g of p.option_groups||[]){const box=el('div',undefined,'options');box.append(el('h4',g.name),el('small',(g.min>0?'Obrigatório':'Opcional')+' · mínimo '+g.min+' · máximo '+g.max));if(g.min>0)box.append(el('div','Escolha obrigatória','required'));for(const o of g.options){const label=el('label',undefined,'option'),input=document.createElement('input');input.type='checkbox';input.value=o.id;input.dataset.group=g.id;input.addEventListener('change',()=>{const chosen=selectedFor(g,optionsBox);if(chosen.length>g.max){input.checked=false;msg('O grupo '+g.name+' permite até '+g.max+' escolha(s).')}});label.append(input,el('span',o.name),el('span',Number(o.price)>0?'+'+money(o.price):'Grátis'));box.append(label)}optionsBox.append(box)}section.append(optionsBox);const actions=el('div',undefined,'actions'),qty=document.createElement('input');qty.type='number';qty.min=1;qty.max=20;qty.value=1;qty.style.width='80px';const add=el('button','Adicionar ao pedido');add.type='button';add.onclick=()=>{const n=Number(qty.value);if(!Number.isInteger(n)||n<1||n>20){msg('Quantidade deve ser entre 1 e 20.');return}const chosen=[];let extra=0,labels=[];for(const g of p.option_groups||[]){const ids=selectedFor(g,optionsBox);if(ids.length<g.min||ids.length>g.max){msg('Confira as escolhas de '+g.name+': mínimo '+g.min+', máximo '+g.max+'.');return}for(const id of ids){const o=g.options.find(o=>o.id===id);chosen.push(id);extra+=Number(o.price);labels.push(o.name)}}if(cart.length>=30){msg('Limite de 30 produtos por pedido.');return}cart.push({product_id:p.id,quantity:n,options:chosen,name:p.name,labels,unit:Number(p.price)+extra});renderCart();msg('Produto adicionado ao carrinho.')};actions.append(qty,add);section.append(actions);root.append(section)}if(!menu.products.length)root.append(el('p','Esta loja ainda não possui produtos disponíveis.'))}
function renderCart(){const root=$('cart');root.replaceChildren();if(!cart.length)root.append(el('p','Seu carrinho está vazio.'));for(const item of cart){const line=el('div',undefined,'cartline');line.append(el('strong',item.quantity+' × '+item.name+' — '+money(item.unit*item.quantity)));if(item.labels.length)line.append(el('small',item.labels.join(', ')));const b=el('button','Remover','secondary');b.type='button';b.onclick=()=>{cart=cart.filter(c=>c!==item);renderCart()};line.append(b);root.append(line)}const fee=$('fulfillment').value==='delivery'?Number(menu.store.delivery_fee):0;const subtotal=cart.reduce((sum,x)=>sum+x.unit*x.quantity,0);$('total').replaceChildren(el('span','Total'),el('span',money(subtotal+fee)));$('send').disabled=!cart.length||!$('fulfillment').value||!$('payment').value}
function initOptions(){const s=menu.store;$('storeName').textContent=s.name;$('headerStoreName').textContent=s.name;document.title='Cardápio | '+s.name;if(/^#[0-9a-fA-F]{6}$/.test(s.primary_color||''))document.documentElement.style.setProperty('--brand',s.primary_color);if(/^https:\/\//.test(s.logo_url||'')){$('storeLogo').src=s.logo_url;$('storeLogo').hidden=false}for(const [value,label,allowed] of [['delivery','Entrega',s.delivery_enabled],['pickup','Retirada',s.pickup_enabled]])if(allowed){const o=el('option',label);o.value=value;$('fulfillment').append(o)}const labels={dinheiro:'Dinheiro na entrega',cartao_entrega:'Cartão na entrega',pix_manual:'Pix manual — aguardar conferência'};for(const method of s.payment_methods||[]){const o=el('option',labels[method]||method);o.value=method;$('payment').append(o)}$('fulfillment').onchange=()=>{$('addressBlock').hidden=$('fulfillment').value!=='delivery';$('address').required=!$('addressBlock').hidden;renderCart()};$('fulfillment').dispatchEvent(new Event('change'));renderProducts();$('layout').hidden=false;$('send').disabled=!$('fulfillment').options.length||!$('payment').options.length;msg(!$('fulfillment').options.length?'Esta loja não possui modalidade de entrega ou retirada disponível.':!$('payment').options.length?'Esta loja ainda não configurou formas de pagamento.':'Cardápio carregado.')}
$('checkout').onsubmit=async e=>{e.preventDefault();if(!cart.length)return;const phoneDigits=$('phone').value.replace(/\D/g,'');if(phoneDigits.length<10||phoneDigits.length>11){msg('Informe um telefone válido com DDD (10 ou 11 dígitos).');$('phone').focus();return}if($('fulfillment').value==='delivery'&&$('address').value.trim().length<10){msg('Informe o endereço completo de entrega.');$('address').focus();return}if(!$('payment').value){msg('Selecione uma forma de pagamento disponível.');$('payment').focus();return}const button=$('send');button.disabled=true;try{const items=cart.map(({product_id,quantity,options})=>({product_id,quantity,options}));const{data,error}=await client.rpc('checkout_public_order',{p_slug:slug,p_request:requestId,p_customer:$('customer').value.trim(),p_phone:$('phone').value,p_address:$('fulfillment').value==='delivery'?$('address').value:'',p_items:items,p_fulfillment:$('fulfillment').value,p_payment:$('payment').value,p_notes:$('notes').value});if(error)throw error;$('checkout').hidden=true;$('success').hidden=false;$('success').replaceChildren(el('h2','Pedido recebido!'),el('p','Número do pedido: '+data.order_id),el('p','Total confirmado: '+money(data.total)),el('p',data.payment_status==='pending'?'Pagamento pendente de confirmação.':'Pagamento registrado.'));if(data.payment_instructions)$('success').append(el('p','Instruções de pagamento: '+data.payment_instructions));if(data.tracking_token){const a=el('a','Acompanhar meu pedido');a.href='/acompanhar/?token='+encodeURIComponent(data.tracking_token);a.style.cssText='display:inline-block;margin:12px 0;color:#d8432d;font-weight:900';$('success').append(a);const hint=el('p','Guarde este link para acompanhar o pedido. As notificações do navegador serão oferecidas na página de acompanhamento.');$('success').append(hint)}msg('Pedido registrado com sucesso.')}catch(err){msg('Não foi possível finalizar: '+err.message);button.disabled=false}};
if(!/^[a-z0-9][a-z0-9-]{2,59}$/.test(slug)){msg('Informe o endereço do cardápio: /cardapio/?loja=nome-da-loja')}else{client.rpc('get_public_menu',{p_slug:slug}).then(({data,error})=>{if(error)throw error;menu=data;initOptions()}).catch(err=>msg('Cardápio indisponível: '+err.message))}
</script></body></html>
