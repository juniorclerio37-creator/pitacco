<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acompanhar pedido | Pitacco</title><style>body{font:16px system-ui,sans-serif;background:#fff8f4;color:#33251f;margin:0}header,main{max-width:660px;margin:auto;padding:22px}header a{color:#db482f;font-weight:900;font-size:24px;text-decoration:none}main{background:white;border:1px solid #edddd2;border-radius:17px;margin:18px auto;padding:26px}.steps{list-style:none;padding:0}.steps li{padding:15px;border-left:4px solid #ddd;margin:10px 0;background:#faf7f5;border-radius:8px}.steps li.done{border-color:#3b9e68}.steps li.active{border-color:#e34c33;background:#fff0e7;font-weight:800}.note{color:#71655e}button{background:#e34c33;color:white;border:0;border-radius:8px;padding:12px 16px;font-weight:800;cursor:pointer}.notice{background:#fff0e7;padding:12px;border-radius:10px}small{color:#756c66}</style></head><body><header><a href="/">⌖ Pitacco</a></header><main><h1>Acompanhe seu pedido</h1><p id="message" class="notice" role="status">Carregando…</p><section id="content" hidden><h2 id="number"></h2><p id="total"></p><ol class="steps" id="steps"></ol><p class="note">O acompanhamento é atualizado automaticamente enquanto esta página estiver aberta. Guarde este endereço para consultar novamente.</p><button id="notify" hidden>Ativar avisos neste dispositivo</button><p id="notifyInfo" class="note"></p></section></main><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const client=createClient('https://mdevzehqcpcgxspwbiyz.supabase.co','sb_publishable_JLIp1y5II26GrztrKDNIyQ_ryETrCuj');
const $=id=>document.getElementById(id),token=new URLSearchParams(location.search).get('token')||'',money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0);
let previous=null,working=false;
function statusFor(d){const p=String(d.preparation_status||'').toLowerCase(),s=String(d.status||'').toLowerCase(),delivery=String(d.delivery_status||'').toLowerCase();if(['delivered','entregue','completed'].includes(delivery)||['delivered','entregue','completed'].includes(s))return 5;if(['out_for_delivery','delivering','em_entrega','in_transit'].includes(delivery)||['out_for_delivery','delivering','em_entrega'].includes(s))return 4;if(['ready','pronto'].includes(p))return 3;if(['preparing','em_preparo','in_preparation'].includes(p))return 2;if(['accepted','aceito'].includes(s))return 1;return 0}
function render(d){$('content').hidden=false;$('number').textContent='Pedido #'+d.order_id.slice(0,8).toUpperCase();$('total').textContent='Valor: '+money(d.total);const pickup=d.fulfillment==='pickup',labels=['Pedido recebido','Pedido aceito','Em preparo','Pronto',pickup?'Retirado':'Saiu para entrega',pickup?'Concluído':'Entregue'];const current=statusFor(d),root=$('steps');root.replaceChildren();for(let i=0;i<labels.length;i++){const li=document.createElement('li');li.textContent=labels[i];li.className=i<current?'done':i===current?'active':'';root.append(li)}$('message').textContent='Situação atual: '+labels[current]+'.';if(previous!==null&&previous!==current&&document.visibilityState==='visible'&&Notification.permission==='granted'){try{new Notification('Pitacco — '+labels[current],{body:'Seu pedido foi atualizado.'})}catch{}}previous=current}
async function refresh(){if(working)return;working=true;try{const{data,error}=await client.rpc('pitacco_track_public_order',{p_token:token});if(error)throw error;if(!data){$('content').hidden=true;$('message').textContent='Link inválido ou expirado.';return}render(data)}catch(e){$('message').textContent='Não foi possível atualizar o pedido: '+e.message}finally{working=false}}
if(!/^[0-9a-f-]{36}$/i.test(token)){$('message').textContent='Link de acompanhamento inválido.'}else{refresh();setInterval(refresh,15000)}
if('Notification'in window&&window.isSecureContext){$('notify').hidden=false;$('notify').onclick=async()=>{const result=await Notification.requestPermission();$('notifyInfo').textContent=result==='granted'?'Avisos ativados enquanto esta página estiver aberta.':'Você pode acompanhar o pedido aqui mesmo.'}}else{$('notifyInfo').textContent='Este navegador não permite avisos nesta página.'}
</script></body></html>
