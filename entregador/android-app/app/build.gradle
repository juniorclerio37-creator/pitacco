plugins {
    id 'com.android.application' version '8.7.3'
    id 'com.google.gms.google-services' version '4.4.3' apply false
}
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.firebase:firebase-messaging:24.1.2'
}

android {
    namespace 'br.com.pitacco.entregador'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.pitacco.entregador'
        minSdk 26
        targetSdk 35
        versionCode 21
        versionName '2.0.1'
        manifestPlaceholders = [pitaccoAppLabel: 'Pitacco Entregador']
    }
    buildTypes {
        debug {
            applicationIdSuffix '.teste'
            versionNameSuffix '-teste'
            manifestPlaceholders.pitaccoAppLabel = 'Pitacco Entregador TESTE'
        }
    }
}
