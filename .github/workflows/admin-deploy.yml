name: Pitacco Control Center — validar e publicar
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'revisions/0.12/web/AdminApp.jsx'
      - 'revisions/0.12/web/Control*.jsx'
      - 'revisions/0.12/web/control-center.css'
      - 'revisions/0.12/web/controlCenter.mjs'
      - 'revisions/0.12/web/tests/backend/**'
      - 'tests/control-center*'
      - 'cloudflare/control-releases.mjs'
      - 'revisions/0.12/web/StoreProfile.jsx'
      - 'revisions/0.12/restore.py'
      - 'supabase/migrations/**'
      - 'revisions/0.12/web/ScheduleSettings.jsx'
      - 'revisions/0.12/web/StoreOpeningHours.jsx'
      - 'revisions/0.12/web/store-opening-hours.css'
      - 'revisions/0.12/web/Homologation.jsx'
      - 'revisions/0.12/web/OwnerIfood.jsx'
      - 'revisions/0.12/web/OwnerIfoodCentralRequests.jsx'
      - 'revisions/0.12/web/IfoodConnections.jsx'
      - 'revisions/0.12/web/PaymentHomologation.jsx'
      - 'revisions/0.12/web/PagBankSandbox.jsx'
      - 'revisions/0.12/web/OwnerSubscriptions.jsx'
      - 'revisions/0.12/web/OwnerFinance.jsx'
      - 'revisions/0.12/web/OwnerCommercialFinance.jsx'
      - 'revisions/0.12/web/OwnerPlans.jsx'
      - 'revisions/0.12/web/PlanChange.jsx'
      - 'revisions/0.12/web/OwnerCourierCampaigns.jsx'
      - 'revisions/0.12/web/owner-courier-campaigns.css'
      - 'revisions/0.12/web/OwnerIncidentNotifier.jsx'
      - 'revisions/0.12/web/owner-incident-notifier.css'
      - 'revisions/0.12/web/IncidentCenter.jsx'
      - 'revisions/0.12/web/PitaccoIntelligence.jsx'
      - 'revisions/0.12/web/IntelligenceRepairs.jsx'
      - 'revisions/0.12/web/RecoveryPreflight.jsx'
      - 'cloudflare/admin-ai-worker.mjs'
      - 'cloudflare/sales-coach.mjs'
      - 'revisions/0.12/web/BusinessInsights.jsx'
      - 'wrangler.admin.jsonc'
      - 'revisions/0.12/web/super-admin.css'
      - 'scripts/build-admin-cloudflare.sh'
      - '.github/workflows/admin-deploy.yml'
permissions:
  contents: read
jobs:
  preflight:
    name: Verificar autorização de publicação do Admin
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.inspect.outputs.ready }}
    steps:
      - id: inspect
        shell: bash
        env:
          PITACCO_ADMIN_CLOUDFLARE_API_TOKEN: ${{ secrets.PITACCO_ADMIN_CLOUDFLARE_API_TOKEN }}
          PITACCO_ADMIN_CLOUDFLARE_ACCOUNT_ID: ${{ vars.PITACCO_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$PITACCO_ADMIN_CLOUDFLARE_API_TOKEN" || -z "$PITACCO_ADMIN_CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Publicação do Pitacco Admin aguardando configuração"
              echo "Cadastre o segredo \`PITACCO_ADMIN_CLOUDFLARE_API_TOKEN\` e a variável \`PITACCO_ADMIN_CLOUDFLARE_ACCOUNT_ID\` nos ajustes do GitHub Actions."
              echo "O Admin em produção não será substituído até que a publicação seja autorizada."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Cloudflare Admin ainda não autorizado no GitHub Actions."
          elif [[ ! "$PITACCO_ADMIN_CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::O Account ID do Pitacco Admin deve ter 32 caracteres hexadecimais."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Publicação autorizada: token e Account ID configurados." >> "$GITHUB_STEP_SUMMARY"
          fi
  validate:
    name: Validar segurança, banco e interface do Control Center
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PITACCO_WEB_ONLY: '1'
      DATABASE_URL: postgres://postgres:isolated-ci-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restaurar e testar regras e permissões
        run: |
          python3 revisions/0.12/restore.py
          node --test tests/*.test.mjs
          npm ci --prefix web
          npm test --prefix web
          npm ci --prefix web/tests/backend
          npm install --prefix web/tests/backend --no-save --package-lock=false pg@8.16.3
          node web/tests/backend/run.mjs
          node web/tests/backend/concurrency.mjs
      - name: Construir a interface administrativa real
        run: bash scripts/build-admin-cloudflare.sh
      - name: Validar navegação, temas, formulários, consentimento e permissões no navegador
        run: |
          npm install --prefix web --no-save --package-lock=false playwright@1.58.2
          (cd web && npx playwright install --with-deps chromium)
          node tests/control-center.browser.mjs
      - name: Guardar evidências visuais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitacco-control-center-visual
          path: artifacts/control-center-*.png
          if-no-files-found: ignore
  publish:
    name: Construir e publicar admin.pitacco.com.br
    needs: [preflight, validate]
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Construir Painel de Administração
        shell: bash
        run: |
          bash scripts/build-admin-cloudflare.sh
          test -s web/dist-admin/index.html
          grep -Rql 'pitacco_owner_incident_pulse' web/dist-admin/assets
          grep -Rql 'pitacco_owner_diagnostic_snapshot' web/dist-admin/assets
          grep -Rql 'pitacco_owner_repair_decide' web/dist-admin/assets
          grep -Rql 'pitacco_owner_recovery_preflight' web/dist-admin/assets
          grep -Rql 'pitacco_admin_send_courier_campaign' web/dist-admin/assets
          grep -Rql 'pitacco_owner_resolve_asaas_incident' web/dist-admin/assets
      - name: Publicar no Worker existente
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PITACCO_ADMIN_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.PITACCO_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.162.0 deploy --config wrangler.admin.jsonc --keep-vars
