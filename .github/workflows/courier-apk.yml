name: Pitacco Entregador APK
on:
  workflow_dispatch:
  pull_request:
    paths: ['entregador/android-app/**', '.github/workflows/courier-apk.yml']
  push:
    branches: [main]
    paths: ['entregador/android-app/**', '.github/workflows/courier-apk.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK for testing
        working-directory: entregador/android-app
        run: gradle --no-daemon assembleDebug
      - name: Verify APK signature and hash
        working-directory: entregador/android-app/app/build/outputs/apk/debug
        run: |
          mv app-debug.apk Pitacco-Entregador-1.0.0-teste.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Pitacco-Entregador-1.0.0-teste.apk
          sha256sum Pitacco-Entregador-1.0.0-teste.apk > SHA256-ANDROID.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Pitacco-Entregador-Android-teste
          path: |
            entregador/android-app/app/build/outputs/apk/debug/Pitacco-Entregador-1.0.0-teste.apk
            entregador/android-app/app/build/outputs/apk/debug/SHA256-ANDROID.txt
          if-no-files-found: error
