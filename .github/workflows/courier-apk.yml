name: Pitacco Entregador APK
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Canal da compilação
        type: choice
        required: true
        default: teste
        options: [teste, estavel]
  pull_request:
    paths: ['entregador/android-app/**', '.github/workflows/courier-apk.yml']
  push:
    branches: [main]
    paths: ['entregador/android-app/**', '.github/workflows/courier-apk.yml']
permissions:
  contents: read
jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.channel == 'teste'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare test sound without production Firebase credentials
        run: |
          python3 entregador/android-app/generate-alert.py
          python3 entregador/android-app/verify-voice-alert.py
          # The test APK has a separate application ID, so do not copy the
          # production Firebase registration into this QA-only package.
          # This test validates installation, local notifications, and WebView.
          # Real FCM push requires a separately registered test Android app.
      - name: Build APK for testing
        working-directory: entregador/android-app
        run: gradle --no-daemon assembleDebug
      - name: Verify APK signature and hash
        working-directory: entregador/android-app/app/build/outputs/apk/debug
        run: |
          mv app-debug.apk Pitacco-Entregador-2.0.16-TESTE-PARALELO.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Pitacco-Entregador-2.0.16-TESTE-PARALELO.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Pitacco-Entregador-2.0.16-TESTE-PARALELO.apk | head -15
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Pitacco-Entregador-2.0.16-TESTE-PARALELO.apk | grep -q "package: name='br.com.pitacco.entregador.teste'"
          sha256sum Pitacco-Entregador-2.0.16-TESTE-PARALELO.apk > SHA256-ANDROID.txt
      - name: Exercise release signing with an isolated test certificate
        if: github.event_name == 'pull_request'
        working-directory: entregador/android-app
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf -- "$tmp"' EXIT
          export PITACCO_ANDROID_KEYSTORE="$tmp/test.p12"
          export PITACCO_ANDROID_KEY_ALIAS='pitacco-ci'
          export PITACCO_ANDROID_KEYSTORE_PASSWORD='integration-test-password'
          export PITACCO_ANDROID_KEY_PASSWORD="$PITACCO_ANDROID_KEYSTORE_PASSWORD"
          keytool -genkeypair -storetype PKCS12 -keyalg RSA -keysize 2048 -validity 10 \
            -dname 'CN=Pitacco CI' -keystore "$PITACCO_ANDROID_KEYSTORE" \
            -alias "$PITACCO_ANDROID_KEY_ALIAS" -storepass:env PITACCO_ANDROID_KEYSTORE_PASSWORD
          gradle --no-daemon assembleRelease
          expected=$(keytool -exportcert -keystore "$PITACCO_ANDROID_KEYSTORE" \
            -alias "$PITACCO_ANDROID_KEY_ALIAS" -storepass:env PITACCO_ANDROID_KEYSTORE_PASSWORD |
            sha256sum | cut -d' ' -f1)
          export PITACCO_ANDROID_CERT_SHA256="$expected"
          bash sign-release.sh app/build/outputs/apk/release/app-release-unsigned.apk "$tmp/signed"
          (cd "$tmp/signed" && sha256sum --check SHA256-ANDROID.txt)
          export PITACCO_ANDROID_CERT_SHA256="$(printf '%064d' 0)"
          if bash sign-release.sh app/build/outputs/apk/release/app-release-unsigned.apk "$tmp/wrong"; then
            echo 'A compilação aceitou um certificado diferente do configurado.' >&2
            exit 1
          fi
          test ! -e "$tmp/wrong"
      - uses: actions/upload-artifact@v4
        with:
          name: Pitacco-Entregador-Android-teste
          path: |
            entregador/android-app/app/build/outputs/apk/debug/Pitacco-Entregador-2.0.16-TESTE-PARALELO.apk
            entregador/android-app/app/build/outputs/apk/debug/SHA256-ANDROID.txt
          if-no-files-found: error

  release-preflight:
    name: Verificar credenciais oficiais do Android
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.channel == 'estavel'))
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Conferir Firebase e assinatura sem expor segredos
        id: check
        shell: bash
        env:
          PITACCO_FIREBASE_ANDROID_JSON: ${{ secrets.PITACCO_FIREBASE_ANDROID_JSON }}
          PITACCO_ANDROID_KEYSTORE_BASE64: ${{ secrets.PITACCO_ANDROID_KEYSTORE_BASE64 }}
          PITACCO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PITACCO_ANDROID_KEYSTORE_PASSWORD }}
          PITACCO_ANDROID_KEY_ALIAS: ${{ secrets.PITACCO_ANDROID_KEY_ALIAS }}
          PITACCO_ANDROID_KEY_PASSWORD: ${{ secrets.PITACCO_ANDROID_KEY_PASSWORD }}
          PITACCO_ANDROID_CERT_SHA256: ${{ vars.PITACCO_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          required=(PITACCO_FIREBASE_ANDROID_JSON PITACCO_ANDROID_KEYSTORE_BASE64
            PITACCO_ANDROID_KEYSTORE_PASSWORD PITACCO_ANDROID_KEY_ALIAS
            PITACCO_ANDROID_KEY_PASSWORD PITACCO_ANDROID_CERT_SHA256)
          missing=()
          for key in "${required[@]}"; do
            if [[ -z "${!key:-}" ]]; then missing+=("$key"); fi
          done
          if (( ${#missing[@]} != 0 )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Publicação Android pendente"
              echo "O APK de teste será compilado; a versão estável não será publicada sem as credenciais oficiais:"
              printf -- "- \`%s\`\n" "${missing[@]}"
              echo "Cadastre os segredos em Settings → Secrets and variables → Actions, sem colocá-los no código ou em mensagens."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::APK estável bloqueado por configuração de assinatura/Firebase incompleta."
          elif [[ ! "$(printf '%s' "$PITACCO_ANDROID_CERT_SHA256" | tr -d ':[:space:]')" =~ ^[A-Fa-f0-9]{64}$ ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Formato de impressão digital do certificado inválido."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "### Credenciais de publicação presentes" >> "$GITHUB_STEP_SUMMARY"
            echo "O APK ainda será validado e a assinatura oficial será conferida antes da publicação." >> "$GITHUB_STEP_SUMMARY"
          fi

  stable:
    needs: release-preflight
    if: needs.release-preflight.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile APK with Firebase configuration
        working-directory: entregador/android-app
        env:
          PITACCO_FIREBASE_ANDROID_JSON: ${{ secrets.PITACCO_FIREBASE_ANDROID_JSON }}
        run: |
          : "${PITACCO_FIREBASE_ANDROID_JSON:?Configure PITACCO_FIREBASE_ANDROID_JSON}"
          trap 'rm -f app/google-services.json' EXIT
          umask 077
          printf '%s' "$PITACCO_FIREBASE_ANDROID_JSON" > app/google-services.json
          python3 generate-alert.py
          python3 verify-voice-alert.py
          gradle --no-daemon assembleRelease
      - name: Sign APK and verify official certificate
        working-directory: entregador/android-app
        env:
          PITACCO_ANDROID_KEYSTORE_BASE64: ${{ secrets.PITACCO_ANDROID_KEYSTORE_BASE64 }}
          PITACCO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PITACCO_ANDROID_KEYSTORE_PASSWORD }}
          PITACCO_ANDROID_KEY_ALIAS: ${{ secrets.PITACCO_ANDROID_KEY_ALIAS }}
          PITACCO_ANDROID_KEY_PASSWORD: ${{ secrets.PITACCO_ANDROID_KEY_PASSWORD }}
          PITACCO_ANDROID_CERT_SHA256: ${{ vars.PITACCO_ANDROID_CERT_SHA256 }}
        run: |
          : "${PITACCO_ANDROID_KEYSTORE_BASE64:?Configure PITACCO_ANDROID_KEYSTORE_BASE64}"
          umask 077
          export PITACCO_ANDROID_KEYSTORE
          PITACCO_ANDROID_KEYSTORE=$(mktemp)
          trap 'rm -f -- "$PITACCO_ANDROID_KEYSTORE"' EXIT
          printf '%s' "$PITACCO_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$PITACCO_ANDROID_KEYSTORE"
          unset PITACCO_ANDROID_KEYSTORE_BASE64
          bash sign-release.sh app/build/outputs/apk/release/app-release-unsigned.apk distribution
      # A validação precisa inspecionar o APK final, não apenas o AndroidManifest.xml.
      - name: Conferir permissões e identidade do APK oficial
        working-directory: entregador/android-app
        shell: bash
        run: |
          set -euo pipefail
          apk=distribution/Pitacco-Entregador-2.0.16.apk
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -s "$apk"
          "$aapt" dump badging "$apk" | grep -F "package: name='br.com.pitacco.entregador'" | grep -F "versionCode='36'"
          "$aapt" dump permissions "$apk" | grep -F "android.permission.ACCESS_FINE_LOCATION"
          "$aapt" dump permissions "$apk" | grep -F "android.permission.ACCESS_COARSE_LOCATION"
          "$aapt" dump permissions "$apk" | grep -F "android.permission.ACCESS_BACKGROUND_LOCATION"
          "$aapt" dump permissions "$apk" | grep -F "android.permission.ACTIVITY_RECOGNITION"
          "$aapt" dump permissions "$apk" | grep -F "android.permission.POST_NOTIFICATIONS"
          "$aapt" dump permissions "$apk" | grep -F "android.permission.FOREGROUND_SERVICE"
          "$aapt" dump permissions "$apk" | grep -F "android.permission.FOREGROUND_SERVICE_LOCATION"
          "$aapt" dump xmltree "$apk" AndroidManifest.xml | grep -F "CourierLocationService"
          echo "APK oficial mantém a identidade existente e declara GPS de plantão em foreground service."
      - uses: actions/upload-artifact@v4
        with:
          name: Pitacco-Entregador-Android-estavel
          path: entregador/android-app/distribution/
          if-no-files-found: error

  publish-stable:
    name: Publicar APK oficial assinado
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.channel == 'estavel'))
    needs: stable
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Obter APK assinado e verificado
        uses: actions/download-artifact@v4
        with:
          name: Pitacco-Entregador-Android-estavel
          path: release
      - name: Conferir integridade antes de disponibilizar
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256-ANDROID.txt
          test -s ASSINATURA-ANDROID.txt
          shopt -s nullglob
          apks=(Pitacco-Entregador-*.apk)
          test "${#apks[@]}" -eq 1
          test -s "${apks[0]}"
      - name: Publicar download do entregador
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(release/Pitacco-Entregador-*.apk)
          test "${#apks[@]}" -eq 1
          filename=${apks[0]##*/}
          version=${filename#Pitacco-Entregador-}
          version=${version%.apk}
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="pitacco-entregador-v${version}-${GITHUB_SHA:0:12}"
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "APK já publicado: $tag"
          else
            gh release create "$tag"               "release/$filename" "release/SHA256-ANDROID.txt" "release/ASSINATURA-ANDROID.txt"               --repo "$GH_REPO" --target "$GITHUB_SHA" --latest=false               --title "Pitacco Entregador v$version"               --notes "APK assinado com o certificado oficial configurado, com notificações nativas de nova entrega em segundo plano e toque forte. FCM requer cadastro do aparelho e configuração do serviço no Supabase. Android pode restringir o alerta conforme notificações, modo Não Perturbe, bateria e conectividade."
          fi
