name: Asaas commercial adapter tests
on:
  pull_request:
    paths:
      - 'supabase/functions/asaas-*/**'
      - 'docs/sql/asaas-commercial-*.sql'
      - '.github/workflows/asaas-commercial-candidate.yml'
permissions:
  contents: read
jobs:
  adapter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: node --test supabase/functions/asaas-subscription-webhook/tests/commercial-candidate.test.mjs supabase/functions/asaas-subscription-webhook/tests/issue-commercial-candidate.test.mjs supabase/functions/asaas-commercial-payment/enroll-customer.test.mjs
