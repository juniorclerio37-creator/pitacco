name: Pitacco Core — validar fonte consolidada
on:
  push:
    branches: [pitacco-core]
    paths:
      - '.github/workflows/core-validation.yml'
      - 'core-source/**'
      - 'scripts/verify-core-source.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.ref == 'refs/heads/pitacco-core'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:isolated-ci-password@localhost:5432/postgres
      PITACCO_WEB_ONLY: '1'
      VITE_SUPABASE_URL: https://pitacco-fixture.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_fixture_only_123456
      VITE_PITACCO_HOMOLOGACAO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar integridade do snapshot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('core-source')
          m=json.loads((root/'manifest.json').read_text())
          actual={p.relative_to(root).as_posix(): {'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size} for p in root.rglob('*') if p.is_file() and p!=root/'manifest.json'}
          assert actual==m['files'], 'Snapshot divergiu do manifesto'
          assert m['native_repeat_identical']
          print(f"{len(actual)} arquivos verificados")
          PY
      - name: Usar fonte consolidada sem restore legado
        run: |
          test ! -e web
          test ! -e android
          cp -a core-source/web web
          cp -a core-source/android android
      - name: Compilar lojista e Control Center
        run: |
          npm ci --prefix web
          npm run build --prefix web
          (cd web && npm run build -- --config admin.vite.config.mjs --outDir dist-admin)
          test -s web/dist/index.html
          test -s web/dist-admin/admin.html
      - name: Testes do painel e regressões públicas
        run: |
          npm test --prefix web
          node --test tests/*.test.mjs
      - name: Testes de regras PostgreSQL 17 e concorrência
        run: |
          npm ci --prefix web/tests/backend
          npm install --prefix web/tests/backend --no-save --package-lock=false pg@8.16.3
          node web/tests/backend/run.mjs
          node web/tests/backend/concurrency.mjs
