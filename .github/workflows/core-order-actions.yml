name: Pitacco Core — ações de pedidos com SQL original
on:
  push:
    branches: [pitacco-core]
    paths:
      - 'backend/**'
      - '.github/workflows/core-order-actions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actions:
    if: github.ref == 'refs/heads/pitacco-core'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:isolated-ci-password@localhost:5432/postgres
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_HOST: 127.0.0.1
      DB_DATABASE: postgres
      CORE_AUTH_DB_USERNAME: pitacco_core_auth
      CORE_AUTH_DB_PASSWORD: ci-auth-only
      CORE_ACTIONS_DB_USERNAME: pitacco_core_actions
      CORE_ACTIONS_DB_PASSWORD: ci-actions-only
      REDIS_HOST: 127.0.0.1
      CACHE_STORE: redis
      SESSION_DRIVER: array
      LOG_CHANNEL: stderr
      PITACCO_OPENING_HOURS_ENABLED: 'true'
      CORE_OPENING_HOURS_DB_USERNAME: pitacco_core_opening_hours
      CORE_OPENING_HOURS_DB_PASSWORD: ci-opening-hours-only
      PITACCO_DELIVERY_SETTINGS_ENABLED: 'true'
      CORE_DELIVERY_SETTINGS_DB_USERNAME: pitacco_core_delivery_settings
      CORE_DELIVERY_SETTINGS_DB_PASSWORD: ci-delivery-settings-only
      PITACCO_MERCHANT_CHECKOUT_ENABLED: 'true'
      CORE_MERCHANT_CHECKOUT_DB_USERNAME: pitacco_core_merchant_checkout
      CORE_MERCHANT_CHECKOUT_DB_PASSWORD: ci-merchant-checkout-only
      PITACCO_PAYMENT_PUBLISH_ENABLED: 'true'
      CORE_PAYMENT_PUBLISH_DB_USERNAME: pitacco_core_payment_publish
      CORE_PAYMENT_PUBLISH_DB_PASSWORD: ci-payment-publish-only
      PITACCO_PAYMENT_PRICING_ENABLED: 'true'
      CORE_PAYMENT_PRICING_DB_USERNAME: pitacco_core_payment_pricing
      CORE_PAYMENT_PRICING_DB_PASSWORD: ci-payment-pricing-only
      PITACCO_PAYMENT_SETTINGS_ENABLED: 'true'
      CORE_PAYMENT_SETTINGS_DB_USERNAME: pitacco_core_payment_settings
      CORE_PAYMENT_SETTINGS_DB_PASSWORD: ci-payment-settings-only
      PITACCO_FINANCIAL_REPORT_ENABLED: 'true'
      CORE_FINANCIAL_DB_USERNAME: pitacco_core_financial_read
      CORE_FINANCIAL_DB_PASSWORD: ci-financial-read-only
      PITACCO_AUTH_ENABLED: 'true'
      PITACCO_ACTIONS_ENABLED: 'true'
      PITACCO_FIADO_OVERVIEW_ENABLED: 'true'
      PITACCO_FIADO_MANAGE_ENABLED: 'true'
      CORE_FIADO_MANAGE_DB_USERNAME: pitacco_core_fiado_manage
      CORE_FIADO_MANAGE_DB_PASSWORD: ci-fiado-manage-only
      CORE_FIADO_DB_USERNAME: pitacco_core_fiado_read
      CORE_FIADO_DB_PASSWORD: ci-fiado-read-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, mbstring, dom, curl
          tools: composer:v2
          coverage: none
      - name: Reconstruir SQL original em banco descartável
        run: |
          cp -a core-source/web web
          cp -a core-source/android android
          npm ci --prefix web/tests/backend
          npm install --prefix web/tests/backend --no-save --package-lock=false pg@8.16.3
          node web/tests/backend/run.mjs
          PGPASSWORD=isolated-ci-password psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f core-source/web/supabase/032_single_print_computer.sql
      - name: Preparar cadastros fictícios e permissões específicas
        run: |
          hash=$(php -r 'echo password_hash("fixture-only-password", PASSWORD_BCRYPT, ["cost"=>12]);')
          PGPASSWORD=isolated-ci-password psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -v password_hash="$hash" -f backend/tests/auth-fixture.sql -f backend/tests/actions-fixture.sql -f backend/tests/order-outbox-fixture.sql -f backend/tests/own-board-fixture.sql -f backend/tests/own-print-fixture.sql
          test "$(PGPASSWORD=ci-actions-only psql -h 127.0.0.1 -U pitacco_core_actions -d postgres -Atc 'select count(id) from public.orders')" = 0
          if PGPASSWORD=ci-actions-only psql -h 127.0.0.1 -U pitacco_core_actions -d postgres -v ON_ERROR_STOP=1 -c "update public.orders set status='accepted'"; then exit 1; fi
          if PGPASSWORD=ci-fiado-read-only psql -h 127.0.0.1 -U pitacco_core_fiado_read -d postgres -v ON_ERROR_STOP=1 -c 'select * from public.pitacco_fiado_customers'; then exit 1; fi
          if PGPASSWORD=ci-fiado-manage-only psql -h 127.0.0.1 -U pitacco_core_fiado_manage -d postgres -v ON_ERROR_STOP=1 -c 'update public.pitacco_fiado_customers set used=0'; then exit 1; fi
          if PGPASSWORD=ci-financial-read-only psql -h 127.0.0.1 -U pitacco_core_financial_read -d postgres -v ON_ERROR_STOP=1 -c 'select * from public.store_payment_receipts'; then exit 1; fi
          if PGPASSWORD=ci-payment-settings-only psql -h 127.0.0.1 -U pitacco_core_payment_settings -d postgres -v ON_ERROR_STOP=1 -c 'update public.public_menu_settings set enabled=false'; then exit 1; fi
          test "$(PGPASSWORD=ci-payment-pricing-only psql -h 127.0.0.1 -U pitacco_core_payment_pricing -d postgres -Atc "select has_function_privilege(current_user,'public.pitacco_publish_payment_price(uuid,text,text,bigint)','execute')")" = f
          if PGPASSWORD=ci-payment-publish-only psql -h 127.0.0.1 -U pitacco_core_payment_publish -d postgres -v ON_ERROR_STOP=1 -c 'update pitacco_private.payment_pricing_release set publication_enabled=true'; then exit 1; fi
          test "$(PGPASSWORD=ci-merchant-checkout-only psql -h 127.0.0.1 -U pitacco_core_merchant_checkout -d postgres -Atc "select has_function_privilege(current_user,'public.confirm_manual_payment(uuid,uuid,numeric,text)','execute')")" = f
          if PGPASSWORD=ci-delivery-settings-only psql -h 127.0.0.1 -U pitacco_core_delivery_settings -d postgres -v ON_ERROR_STOP=1 -c 'update public.pitacco_delivery_pricing set enabled=false'; then exit 1; fi
          if PGPASSWORD=ci-opening-hours-only psql -h 127.0.0.1 -U pitacco_core_opening_hours -d postgres -v ON_ERROR_STOP=1 -c 'update public.pitacco_store_hours set paused=false'; then exit 1; fi
      - name: Testar operações via Laravel
        working-directory: backend
        env:
          PITACCO_ORDER_OUTBOX_ENABLED: 'true'
          PITACCO_OWN_BOARD_ENABLED: 'true'
          PITACCO_SHIPPING_SIMULATION_ENABLED: 'true'
          PITACCO_OWN_PRINT_ENABLED: 'true'
          CORE_OWN_PRINT_DB_USERNAME: pitacco_core_own_print
          CORE_OWN_PRINT_DB_PASSWORD: ci-own-print-only
          CORE_OWN_BOARD_DB_USERNAME: pitacco_core_own_board
          CORE_OWN_BOARD_DB_PASSWORD: ci-own-board-only
        run: |
          composer install --no-interaction --prefer-dist
          composer audit --locked
          if PGPASSWORD=ci-actions-only psql -h 127.0.0.1 -U pitacco_core_actions -d postgres -v ON_ERROR_STOP=1 -c 'select * from core_auth.order_invalidation_fixture'; then exit 1; fi
          php artisan serve --host=127.0.0.1 --port=8080 >/tmp/core-actions.log 2>&1 &
          server=$!
          CORE_REDIS_PREFIX=pitacco_core_report_ci: php artisan serve --host=127.0.0.1 --port=8084 >/tmp/core-report.log 2>&1 &
          report_server=$!
          CORE_REDIS_PREFIX=pitacco_core_pdv_ci: php artisan serve --host=127.0.0.1 --port=8085 >/tmp/core-pdv.log 2>&1 &
          pdv_server=$!
          CORE_REDIS_PREFIX=pitacco_core_store_settings_ci: php artisan serve --host=127.0.0.1 --port=8086 >/tmp/core-store-settings.log 2>&1 &
          settings_server=$!
          CORE_REDIS_PREFIX=pitacco_core_own_board_ci: php artisan serve --host=127.0.0.1 --port=8087 >/tmp/core-own-board.log 2>&1 &
          board_server=$!
          CORE_REDIS_PREFIX=pitacco_core_print_device_ci: php artisan serve --host=127.0.0.1 --port=8088 >/tmp/core-print-device.log 2>&1 &
          print_device_server=$!
          CORE_REDIS_PREFIX=pitacco_core_unified_print_ci: php artisan serve --host=127.0.0.1 --port=8096 >/tmp/core-unified-print.log 2>&1 &
          unified_print_server=$!
          trap 'kill "$server" "$report_server" "$pdv_server" "$settings_server" "$board_server" "$print_device_server" "$unified_print_server" 2>/dev/null || true; cat /tmp/core-actions.log /tmp/core-report.log /tmp/core-pdv.log /tmp/core-store-settings.log /tmp/core-own-board.log /tmp/core-print-device.log /tmp/core-unified-print.log' EXIT
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:8096/up >/dev/null && break; sleep 1; done
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:8088/up >/dev/null && break; sleep 1; done
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:8087/up >/dev/null && break; sleep 1; done
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:8086/up >/dev/null && break; sleep 1; done
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:8085/up >/dev/null && break; sleep 1; done
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:8084/up >/dev/null && break; sleep 1; done
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/up >/dev/null && break; sleep 1; done
          if PGPASSWORD=ci-own-board-only psql -h 127.0.0.1 -U pitacco_core_own_board -d postgres -v ON_ERROR_STOP=1 -c 'select * from public.orders'; then exit 1; fi
          if PGPASSWORD=ci-own-print-only psql -h 127.0.0.1 -U pitacco_core_own_print -d postgres -v ON_ERROR_STOP=1 -c 'select * from public.print_jobs'; then exit 1; fi
          python3 tests/actions-smoke.py
          sed -E '/^[[:space:]]*(begin|commit);[[:space:]]*$/Id' ../core-source/web/supabase/015_advanced_print_routing.sql >/tmp/core-original-print-routing.sql
          PGPASSWORD=isolated-ci-password psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/print-routing-smoke.sql
      - name: Validar sessão autenticada do entregador e autorização GPS
        working-directory: backend
        env:
          PITACCO_COURIER_SHIFT_ENABLED: 'true'
          PITACCO_COURIER_PAYMENT_ENABLED: 'true'
          PITACCO_COURIER_DELIVERY_ENABLED: 'true'
          CORE_COURIER_DELIVERY_DB_USERNAME: pitacco_core_courier_delivery
          CORE_COURIER_DELIVERY_DB_PASSWORD: ci-courier-delivery-only
          CORE_COURIER_PAYMENT_DB_USERNAME: pitacco_core_courier_payment
          CORE_COURIER_PAYMENT_DB_PASSWORD: ci-courier-payment-only
          CORE_COURIER_SHIFT_DB_USERNAME: pitacco_core_courier_shift
          CORE_COURIER_SHIFT_DB_PASSWORD: ci-courier-shift-only
          CORE_REDIS_PREFIX: 'pitacco_core_shift_ci:'
        run: |
          PGPASSWORD=isolated-ci-password psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/courier-shift-fixture.sql -f tests/courier-payment-fixture.sql -f tests/courier-arrival-fixture.sql -f tests/courier-delivery-fixture.sql
          if PGPASSWORD=ci-courier-shift-only psql -h 127.0.0.1 -U pitacco_core_courier_shift -d postgres -v ON_ERROR_STOP=1 -c 'select * from core_auth.sessions'; then exit 1; fi
          if PGPASSWORD=ci-courier-delivery-only psql -h 127.0.0.1 -U pitacco_core_courier_delivery -d postgres -v ON_ERROR_STOP=1 -c 'select * from public.pitacco_own_delivery_codes'; then exit 1; fi
          php artisan serve --host=127.0.0.1 --port=8089 >/tmp/core-shift.log 2>&1 &
          server=$!
          CORE_REDIS_PREFIX=pitacco_core_earnings_ci: php artisan serve --host=127.0.0.1 --port=8097 >/tmp/core-earnings.log 2>&1 &
          earnings_server=$!
          CORE_REDIS_PREFIX=pitacco_core_shift_push_ci: php artisan serve --host=127.0.0.1 --port=8098 >/tmp/core-shift-push.log 2>&1 &
          push_server=$!
          trap 'kill "$server" "$earnings_server" "$push_server" 2>/dev/null || true; cat /tmp/core-shift.log /tmp/core-earnings.log /tmp/core-shift-push.log' EXIT
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:8098/up >/dev/null && break; sleep 1; done
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:8097/up >/dev/null && break; sleep 1; done
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:8089/up >/dev/null && break; sleep 1; done
          python3 tests/courier-shift-smoke.py
          python3 tests/courier-payment-smoke.py
      - name: Validar agrupamento pelo lojista e saída em sessão isolada
        working-directory: backend
        env:
          PITACCO_MERCHANT_DISPATCH_ENABLED: 'true'
          PITACCO_OWN_LOGISTICS_ENABLED: 'true'
          CORE_OWN_LOGISTICS_DB_USERNAME: pitacco_core_own_logistics
          CORE_OWN_LOGISTICS_DB_PASSWORD: ci-own-logistics-only
          CORE_MERCHANT_DISPATCH_DB_USERNAME: pitacco_core_merchant_dispatch
          CORE_MERCHANT_DISPATCH_DB_PASSWORD: ci-merchant-dispatch-only
          PITACCO_COURIER_SHIFT_ENABLED: 'true'
          CORE_COURIER_SHIFT_DB_USERNAME: pitacco_core_courier_shift
          CORE_COURIER_SHIFT_DB_PASSWORD: ci-courier-shift-only
          PITACCO_COURIER_DELIVERY_ENABLED: 'true'
          CORE_COURIER_DELIVERY_DB_USERNAME: pitacco_core_courier_delivery
          CORE_COURIER_DELIVERY_DB_PASSWORD: ci-courier-delivery-only
          CORE_REDIS_PREFIX: 'pitacco_core_group_ci:'
        run: |
          PGPASSWORD=isolated-ci-password psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/merchant-dispatch-fixture.sql -f tests/own-logistics-fixture.sql
          if PGPASSWORD=ci-merchant-dispatch-only psql -h 127.0.0.1 -U pitacco_core_merchant_dispatch -d postgres -v ON_ERROR_STOP=1 -c 'select * from public.deliveries'; then exit 1; fi
          php artisan serve --host=127.0.0.1 --port=8090 >/tmp/core-group.log 2>&1 &
          server=$!
          CORE_REDIS_PREFIX=pitacco_core_own_logistics_ci: php artisan serve --host=127.0.0.1 --port=8094 >/tmp/core-own-logistics.log 2>&1 &
          logistics_server=$!
          CORE_REDIS_PREFIX=pitacco_core_mixed_driver_ci: php artisan serve --host=127.0.0.1 --port=8095 >/tmp/core-mixed-driver.log 2>&1 &
          mixed_driver_server=$!
          CORE_REDIS_PREFIX=pitacco_core_fleet_map_ci: php artisan serve --host=127.0.0.1 --port=8099 >/tmp/core-fleet-map.log 2>&1 &
          fleet_map_server=$!
          trap 'kill "$server" "$logistics_server" "$mixed_driver_server" "$fleet_map_server" 2>/dev/null || true; cat /tmp/core-group.log /tmp/core-own-logistics.log /tmp/core-mixed-driver.log /tmp/core-fleet-map.log' EXIT
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:8099/up >/dev/null && break; sleep 1; done
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:8095/up >/dev/null && break; sleep 1; done
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:8094/up >/dev/null && break; sleep 1; done
          if PGPASSWORD=ci-own-logistics-only psql -h 127.0.0.1 -U pitacco_core_own_logistics -d postgres -v ON_ERROR_STOP=1 -c 'select * from public.deliveries'; then exit 1; fi
          if PGPASSWORD=ci-own-logistics-only psql -h 127.0.0.1 -U pitacco_core_own_logistics -d postgres -v ON_ERROR_STOP=1 -c 'select * from public.couriers'; then exit 1; fi
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:8090/up >/dev/null && break; sleep 1; done
          python3 tests/merchant-dispatch-smoke.py

      - name: Validar autorização privada para futuro Reverb
        working-directory: backend
        env:
          PITACCO_REALTIME_ENABLED: 'true'
          CORE_REALTIME_DB_USERNAME: pitacco_core_realtime
          CORE_REALTIME_DB_PASSWORD: ci-realtime-only
          PITACCO_REALTIME_KEY: fixture-realtime-key
          PITACCO_REALTIME_SECRET: fixture-only-not-for-production-secret
          CORE_REDIS_PREFIX: 'pitacco_core_realtime_ci:'
        run: |
          PGPASSWORD=isolated-ci-password psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/realtime-fixture.sql
          if PGPASSWORD=ci-realtime-only psql -h 127.0.0.1 -U pitacco_core_realtime -d postgres -v ON_ERROR_STOP=1 -c 'select * from public.orders'; then exit 1; fi
          if PGPASSWORD=ci-realtime-only psql -h 127.0.0.1 -U pitacco_core_realtime -d postgres -v ON_ERROR_STOP=1 -c 'select * from core_auth.sessions'; then exit 1; fi
          php artisan serve --host=127.0.0.1 --port=8091 >/tmp/core-realtime.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; cat /tmp/core-realtime.log' EXIT
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:8091/up >/dev/null && break; sleep 1; done
          python3 tests/realtime-smoke.py

      - name: Validar servidor Reverb real com canal privado
        working-directory: backend
        env:
          PITACCO_REALTIME_ENABLED: 'true'
          PITACCO_OUTBOX_PUBLISH_ENABLED: 'true'
          CORE_OUTBOX_DB_USERNAME: pitacco_core_outbox
          CORE_OUTBOX_DB_PASSWORD: ci-outbox-only
          CORE_REALTIME_DB_USERNAME: pitacco_core_realtime
          CORE_REALTIME_DB_PASSWORD: ci-realtime-only
          PITACCO_REALTIME_KEY: fixture-realtime-key
          PITACCO_REALTIME_SECRET: fixture-only-not-for-production-secret
          CORE_REDIS_PREFIX: 'pitacco_core_reverb_ci:'
        run: |
          # Resolve and audit only in the disposable runner; no published dependency changes.
          composer require laravel/reverb:1.14.0 --no-interaction --prefer-dist --minimal-changes
          composer audit --locked
          php artisan package:discover --ansi
          php artisan list --raw | grep '^reverb:start '
          PGPASSWORD=isolated-ci-password psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "update core_auth.memberships set active=true where user_id='10000000-0000-4000-8000-000000000001' and store_id='20000000-0000-4000-8000-000000000001' and role='owner'"
          php artisan serve --host=127.0.0.1 --port=8093 >/tmp/core-reverb-api.log 2>&1 &
          api=$!
          php artisan reverb:start --host=127.0.0.1 --port=8092 >/tmp/core-reverb.log 2>&1 &
          ws=$!
          trap 'kill "$api" "$ws" 2>/dev/null || true; cat /tmp/core-reverb-api.log /tmp/core-reverb.log' EXIT
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:8093/up >/dev/null && break; sleep 1; done
          kill -0 "$api"
          kill -0 "$ws"
          if PGPASSWORD=ci-outbox-only psql -h 127.0.0.1 -U pitacco_core_outbox -d postgres -v ON_ERROR_STOP=1 -c 'select * from public.orders'; then exit 1; fi
          if PGPASSWORD=ci-outbox-only psql -h 127.0.0.1 -U pitacco_core_outbox -d postgres -v ON_ERROR_STOP=1 -c "delete from core_auth.order_invalidation_fixture"; then exit 1; fi
          python3 tests/reverb-wire-smoke.py
      - name: Guardar dependências experimentais auditadas
        uses: actions/upload-artifact@v4
        with:
          name: core-reverb-composer
          path: |
            backend/composer.json
            backend/composer.lock
          retention-days: 7
