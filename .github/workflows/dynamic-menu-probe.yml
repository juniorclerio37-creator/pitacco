name: Investigar cardápios SPA públicos (temporário)
on:
  push:
    branches: ['fix/dynamic-menu-import-20261123']
    paths:
      - '.github/workflows/dynamic-menu-probe.yml'
      - 'scripts/probe_public_menu.mjs'
      - 'scripts/probe_public_store.py'
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Consultar dados públicos e scripts sem navegador
        run: python3 scripts/probe_public_store.py
      - name: Instalar navegador temporário
        run: |
          npm install --prefix web --no-save --package-lock=false playwright@1.58.2
          (cd web && npx playwright install --with-deps chromium)
      - name: Observar respostas públicas do cardápio
        run: node scripts/probe_public_menu.mjs
