name: Pitacco Entregador — testes
on:
  pull_request:
    paths:
      - 'entregador/**'
      - 'supabase/functions/pitacco-courier-access/**'
      - 'docs/sql/entregador-*'
      - 'docs/sql/driver-earnings-dashboard.sql'
      - 'tests/driver-earnings-dashboard.test.mjs'
      - 'tests/driver-mobile-redesign.test.mjs'
      - 'tests/driver-order-details.test.mjs'
      - 'tests/order-public-labels.test.mjs'
      - 'docs/sql/order-card-public-number-localizer.sql'
      - 'docs/sql/order-detail-public-number.sql'
      - 'revisions/0.12/web/Pedidos.jsx'
      - 'revisions/0.12/web/Operations.jsx'
      - 'revisions/0.12/web/orderDisplay.mjs'
      - 'revisions/0.12/mount_orders_045.py'
      - 'docs/sql/driver-order-details-contact.sql'
      - '.github/workflows/entregador-tests.yml'
  push:
    branches:
      - feature/pitacco-entregador-android
      - feature/entregador-auth-operacional
    paths:
      - 'entregador/**'
      - 'supabase/functions/pitacco-courier-access/**'
      - 'docs/sql/entregador-*'
      - 'docs/sql/driver-earnings-dashboard.sql'
      - 'tests/driver-earnings-dashboard.test.mjs'
      - 'tests/driver-mobile-redesign.test.mjs'
      - 'tests/driver-order-details.test.mjs'
      - 'tests/order-public-labels.test.mjs'
      - 'docs/sql/order-card-public-number-localizer.sql'
      - 'docs/sql/order-detail-public-number.sql'
      - 'revisions/0.12/web/Pedidos.jsx'
      - 'revisions/0.12/web/Operations.jsx'
      - 'revisions/0.12/web/orderDisplay.mjs'
      - 'revisions/0.12/mount_orders_045.py'
      - 'docs/sql/driver-order-details-contact.sql'
      - '.github/workflows/entregador-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar regras de acesso e entregas
        run: node --test entregador/*.test.mjs tests/driver-earnings-dashboard.test.mjs tests/driver-mobile-redesign.test.mjs tests/driver-order-details.test.mjs tests/order-public-labels.test.mjs
