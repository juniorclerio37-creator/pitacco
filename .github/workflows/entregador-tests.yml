name: Pitacco Entregador — testes
on:
  pull_request:
    paths:
      - 'entregador/**'
      - '.github/workflows/entregador-tests.yml'
  push:
    branches:
      - feature/pitacco-entregador-android
    paths:
      - 'entregador/**'
      - '.github/workflows/entregador-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar regras de acesso e entregas
        run: node --test entregador/*.test.mjs
