name: Validar site e cardápio
on:
  push:
    branches: [main]
    paths:
      - 'marketing/**'
      - 'scripts/build-cloudflare.sh'
      - 'scripts/build-admin-cloudflare.sh'
      - 'wrangler.admin.jsonc'
      - 'scripts/homologation-site.mjs'
      - 'revisions/0.12/**'
      - 'web/**'
      - 'tests/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/site-validation.yml'
  pull_request:
    paths:
      - 'marketing/**'
      - 'scripts/build-cloudflare.sh'
      - 'scripts/build-admin-cloudflare.sh'
      - 'wrangler.admin.jsonc'
      - 'scripts/homologation-site.mjs'
      - 'revisions/0.12/**'
      - 'web/**'
      - 'tests/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/site-validation.yml'
  workflow_dispatch:
jobs:
  postgres:
    name: Validar migrações no PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:isolated-ci-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 -X utf8 revisions/0.12/restore.py
      - run: npm ci --prefix web/tests/backend
      - run: npm install --prefix web/tests/backend --no-save --package-lock=false pg@8.16.3
      - run: node web/tests/backend/run.mjs
      - run: node web/tests/backend/concurrency.mjs

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar JavaScript dos cardápios e configurações
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=['marketing/cardapio.html','marketing/acompanhar.html','marketing/identidade.html','marketing/configuracao.html']
          for f in files:
              text=Path(f).read_text()
              blocks=re.findall(r'<script[^>]*>(.*?)</script>',text,re.S|re.I)
              if not blocks: raise SystemExit(f'Sem script: {f}')
              for i,block in enumerate(blocks):
                  Path(f'/tmp/pitacco-{Path(f).stem}-{i}.mjs').write_text(block)
          PY
          for file in /tmp/pitacco-*.mjs; do node --check "$file"; done
      - name: Testar regressões do checkout público
        run: node --test tests/*.test.mjs
      - name: Construir site Cloudflare
        run: |
          bash scripts/build-cloudflare.sh
          bash scripts/build-admin-cloudflare.sh
          test -s web/dist-admin/index.html
          if grep -rqE 'platform-owner-login|pitacco_is_platform_owner|pitacco_admin_homologation_results|pitacco_owner_set_feature' web/dist/assets; then
            echo "O painel dos lojistas contém o código do proprietário." >&2
            exit 1
          fi
      - name: Testar regras do painel e migrações em banco isolado
        run: |
          npm test --prefix web
          npm ci --prefix web/tests/backend
          npm test --prefix web/tests/backend
      - name: Testar checkout e acompanhamento no Chromium
        run: |
          npm install --prefix web --no-save --package-lock=false playwright@1.58.2
          (cd web && npx playwright install --with-deps chromium)
          node tests/public-flow.browser.mjs
          node tests/dashboard.browser.mjs
      - name: Validar rotas e Service Worker
        run: |
          test -s web/dist/index.html
          test -s web/dist/cardapio/index.html
          test -s web/dist/acompanhar/index.html
          test -s web/dist/identidade/index.html
          test -s web/dist/configuracao/index.html
          test -s web/dist/sw.js

      - name: Construir homologação isolada dos domínios oficiais
        run: |
          if VITE_SUPABASE_URL=https://mdevzehqcpcgxspwbiyz.supabase.co \
             VITE_SUPABASE_ANON_KEY=sb_publishable_fixture_only_123456 node scripts/homologation-site.mjs; then
            echo "O build de homologação aceitou o banco de produção." >&2
            exit 1
          fi
          sha256sum web/dist/index.html > /tmp/pitacco-production-build.sha256
          PITACCO_HOMOLOG_SUPABASE_URL=https://pitacco-fixture.supabase.co \
            PITACCO_HOMOLOG_SUPABASE_KEY=sb_publishable_fixture_only_123456 \
            bash scripts/build-cloudflare.sh --homologacao
          sha256sum -c /tmp/pitacco-production-build.sha256
          test -s web/dist-homologacao/app/index.html
          test -s web/dist-homologacao/cardapio/index.html
          test -s web/dist-homologacao/acompanhar/index.html
          PITACCO_HOMOLOG_SUPABASE_URL=https://pitacco-fixture.supabase.co \
            PITACCO_HOMOLOG_SUPABASE_KEY=sb_publishable_fixture_only_123456 \
            PITACCO_HOMOLOG_SITE_ORIGIN=https://homologacao.pitacco.test \
            bash scripts/build-admin-cloudflare.sh --homologacao
          test -s web/dist-admin-homologacao/index.html
          grep -rqF 'https://pitacco-fixture.supabase.co' web/dist-admin-homologacao/assets
          if grep -rqF 'https://mdevzehqcpcgxspwbiyz.supabase.co' web/dist-admin-homologacao/assets; then
            echo "O Pitacco Admin de homologação contém a conexão de produção." >&2
            exit 1
          fi
