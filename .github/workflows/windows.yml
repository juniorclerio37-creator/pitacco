name: Pitacco Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['source/**', 'updates/**', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar codigo preservado
        working-directory: .
        shell: python
        run: |
          import base64, hashlib, pathlib, zipfile, io, shutil
          encoded = ''.join(p.read_text() for p in sorted(pathlib.Path('source').glob('*.b64')))
          data = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(data).hexdigest() == 'bd8ad5b51edb6106d6f1b2a9cdecc916950411899a0c5311ce4be37d732ce504', 'Source integrity failure'
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              z.extractall('restored')
          root = pathlib.Path('restored/Pitacco-v0.11')
          for name in ['web', 'android', 'docs']:
              shutil.copytree(root / name, name)
          shutil.copytree('updates/0.11.1/web', 'web', dirs_exist_ok=True)
          for file in ['package.json','package-lock.json','src-tauri/tauri.conf.json','src-tauri/Cargo.toml','src-tauri/Cargo.lock']:
              p = pathlib.Path('web') / file
              p.write_text(p.read_text().replace('0.11.0', '0.11.1'))
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependências
        run: npm ci
      - name: Testes JavaScript
        run: npm test
      - name: Dependências SQL
        run: npm ci --prefix tests/backend
      - name: Testes SQL
        run: npm test --prefix tests/backend
      - name: Testes fila nativa
        run: cargo test --locked --manifest-path native-tests/Cargo.toml
      - name: Dependencia de teste visual
        run: npm install --no-save --package-lock=false playwright@1.58.2
      - name: Teste de navegacao e quadro
        run: node tests/ui-smoke.mjs
      - name: Evidencias de interface
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pitacco-Interface
          path: web/ui-evidence/*.png
          if-no-files-found: ignore
      - name: Instalador NSIS
        run: npm run desktop:build -- --bundles nsis
      - name: Hashes dos instaladores
        run: Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Get-FileHash -Algorithm SHA256 | Format-List | Out-File -Encoding utf8 ../SHA256-WINDOWS.txt
      - name: Instalador e integridade
        uses: actions/upload-artifact@v4
        with:
          name: Pitacco-Windows-x64
          path: |
            web/src-tauri/target/release/bundle/nsis/*.exe
            SHA256-WINDOWS.txt
          if-no-files-found: error
          retention-days: 30
