name: Pitacco Windows
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'revisions/0.12/**'
      - '.github/workflows/windows.yml'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'revisions/0.12/**'
      - 'source/**'
      - 'updates/**'
      - '.github/workflows/windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Verificar scripts Python
        working-directory: .
        run: python -m compileall -q revisions/0.12
      - name: Preparar decodificador do áudio oficial no Windows
        working-directory: .
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Não foi possível instalar o decodificador da voz oficial." }
          }
          $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { throw "ffmpeg não encontrado no runner Windows." }
          ffmpeg -version
      - name: Restaurar codigo preservado
        working-directory: .
        run: python -X utf8 revisions/0.12/restore.py
      - name: Validar pedidos, isolamento e impressão existente
        working-directory: .
        shell: python
        run: |
          from pathlib import Path
          app = Path('web/src.jsx').read_text(encoding='utf-8')
          orders = Path('web/Operations.jsx').read_text(encoding='utf-8')
          native = Path('web/src-tauri/src/main.rs').read_text(encoding='utf-8')
          admin = Path('web/AdminApp.jsx').read_text(encoding='utf-8')
          checks = {
              'backend oficial no Windows': 'const useOfficial=' in app,
              'gestor validado por loja': 'useStoreManagerAccess(supabase,session?.user?.id,selected)' in app,
              'pedidos filtrados por loja': "eq('store_id',storeId)" in orders and 'order.store_id===storeId' in orders,
              'alerta nativo': all(x in orders for x in ('pitacco:bell-choice:',"invoke('play_order_alert_combo'",'Pitacco Original','Moderno','Clássico','Duplo','Intenso')) and all(x in native for x in ('fn merchant_voice_bytes','fn merchant_bell_bytes','fn play_order_alert_combo','fn play_order_bell','order-merchant-voice-1.wav')),
              'fila e teste de impressão existentes': all(name in native for name in ('enqueue_job','retry_job','test_printer')),
              'central separada': "page==='Central de Aplicativos'" in admin and 'pitacco-admin-shell' not in app,
          }
          expected_ui=('pitacco:bell-choice:',"invoke('play_order_alert_combo'",'Pitacco Original','Moderno','Clássico','Duplo','Intenso')
          expected_native=('fn merchant_voice_bytes','fn merchant_bell_bytes','fn play_order_alert_combo','fn play_order_bell','order-merchant-voice-1.wav')
          for token in expected_ui: print("ALERT UI",repr(token),token in orders,flush=True)
          for token in expected_native: print("ALERT RUST",repr(token),token in native,flush=True)
          for label, ok in checks.items():
              print(f'{label}: {ok}', flush=True)
          if not all(checks.values()):
              raise SystemExit('Regressão nos pedidos do Windows ou no limite entre os painéis.')
      - name: Empacotar codigo completo
        working-directory: .
        shell: python
        run: |
          import pathlib,zipfile
          with zipfile.ZipFile('Pitacco-0.12.1-Codigo-Completo.zip','w',zipfile.ZIP_DEFLATED) as z:
              for folder in ['web','android','docs']:
                  for p in pathlib.Path(folder).rglob('*'):
                      if p.is_file() and not any(x in p.parts for x in ['node_modules','target','dist','.git']): z.write(p)
      - uses: actions/upload-artifact@v4
        with:
          name: Pitacco-Codigo-Completo
          path: Pitacco-0.12.1-Codigo-Completo.zip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            web/src-tauri -> target
            web/native-tests -> target
      - name: Dependências
        run: npm ci
      - name: Testes JavaScript
        run: npm test
      - name: Dependências SQL
        run: npm ci --prefix tests/backend
      - name: Testes SQL
        run: npm test --prefix tests/backend
      - name: Testes fila nativa
        run: cargo test --locked --manifest-path native-tests/Cargo.toml
      - name: Configurar atualizador nativo assinado (sem certificado Windows pago)
        working-directory: .
        shell: pwsh
        env:
          PITACCO_TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.PITACCO_TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: python revisions/0.12/configure_windows_updater.py
      - name: Instalador NSIS
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build -- --bundles nsis
      - name: Validar atualizador assinado do Tauri
        shell: pwsh
        env:
          PITACCO_TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.PITACCO_TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe')
          if ($installer.Count -ne 1) { throw 'Esperado um instalador NSIS único.' }
          if (-not [string]::IsNullOrWhiteSpace($env:PITACCO_TAURI_UPDATER_PUBLIC_KEY)) {
            $sig = @((Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe.sig'))
            if ($sig.Count -ne 1 -or $sig[0].Length -lt 30) { throw 'Assinatura do atualizador Tauri ausente.' }
            $conf = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
            if ($conf.plugins.updater.pubkey -ne $env:PITACCO_TAURI_UPDATER_PUBLIC_KEY.Trim()) {
              throw 'Chave pública Tauri não corresponde ao segredo configurado.'
            }
            if ($conf.bundle.createUpdaterArtifacts -ne $true -or $conf.plugins.updater.endpoints.Count -lt 1) {
              throw 'Atualizador Tauri não configurado corretamente.'
            }
            Write-Host 'Atualizador Tauri assinado presente na compilação.'
          } else {
            Write-Host 'Assinatura Tauri indisponível; manter apenas o instalador convencional.'
          }
      - name: Assinar instalador quando certificado estiver configurado
        shell: pwsh
        env:
          PITACCO_SIGN_PFX_BASE64: ${{ secrets.PITACCO_SIGN_PFX_BASE64 }}
          PITACCO_SIGN_PFX_PASSWORD: ${{ secrets.PITACCO_SIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe')
          if ($installers.Count -eq 0) { throw 'Nenhum instalador encontrado para assinatura.' }
          $hasPfx = -not [string]::IsNullOrWhiteSpace($env:PITACCO_SIGN_PFX_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:PITACCO_SIGN_PFX_PASSWORD)
          if ($hasPfx -ne $hasPassword) { throw 'Configure ambos os segredos de assinatura ou nenhum.' }
          if (-not $hasPfx) {
            'NAO ASSINADO: certificado de assinatura de codigo nao configurado.' | Out-File -Encoding utf8 '../ASSINATURA-WINDOWS.txt'
            Write-Warning 'Instalador NAO ASSINADO. Nao distribuir como versao verificada.'
          } else {
            $pfxPath = Join-Path $env:RUNNER_TEMP 'pitacco-signing.pfx'
            try {
              [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PITACCO_SIGN_PFX_BASE64))
              $password = ConvertTo-SecureString $env:PITACCO_SIGN_PFX_PASSWORD -AsPlainText -Force
              $cert = Get-PfxCertificate -FilePath $pfxPath -Password $password
              if (-not $cert.HasPrivateKey) { throw 'Certificado sem chave privada.' }
              $codeSigningOid = '1.3.6.1.5.5.7.3.3'
              $eku = @($cert.EnhancedKeyUsageList | ForEach-Object { $_.ObjectId })
              if ($eku -notcontains $codeSigningOid) { throw 'Certificado nao autorizado para assinatura de codigo.' }
              $signingCert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\\CurrentUser\\My -Password $password
              foreach ($installer in $installers) {
                $signature = Set-AuthenticodeSignature -FilePath $installer.FullName -Certificate $signingCert -TimestampServer 'http://timestamp.digicert.com' -HashAlgorithm SHA256
                if ($signature.Status -ne 'Valid') { throw "Assinatura falhou: $($installer.Name) - $($signature.Status)" }
                $verified = Get-AuthenticodeSignature -FilePath $installer.FullName
                if ($verified.Status -ne 'Valid') { throw "Assinatura nao validada: $($installer.Name)" }
              }
              "ASSINADO: $($signingCert.Subject); Thumbprint: $($signingCert.Thumbprint)" | Out-File -Encoding utf8 '../ASSINATURA-WINDOWS.txt'
            } finally {
              Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
              if ($signingCert) { Remove-Item "Cert:\\CurrentUser\\My\\$($signingCert.Thumbprint)" -Force -ErrorAction SilentlyContinue }
            }
          }
      - name: Verificar instalador com Microsoft Defender
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe')
          if ($exe.Count -eq 0) { throw 'Instalador nao encontrado para verificacao.' }
          $defender = Join-Path $env:ProgramFiles 'Windows Defender/MpCmdRun.exe'
          if (-not (Test-Path $defender)) { throw 'Microsoft Defender CLI indisponivel no runner; verificacao obrigatoria.' }
          & $defender -SignatureUpdate
          if ($LASTEXITCODE -ne 0) { Write-Warning 'Atualizacao de assinaturas nao concluida; verificando com definicoes disponiveis.' }
          foreach ($file in $exe) {
            & $defender -Scan -ScanType 3 -File $file.FullName -DisableRemediation
            if ($LASTEXITCODE -ne 0) { throw "Verificacao do Defender nao aprovada para $($file.Name). Codigo: $LASTEXITCODE" }
          }
          'Microsoft Defender: verificacao concluida sem deteccao no runner. Isto nao garante reputacao Safe Browsing ou SmartScreen.' | Out-File -Encoding utf8 '../VERIFICACAO-WINDOWS.txt'
      - name: Hashes e versão dos instaladores
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Get-FileHash -Algorithm SHA256 | Format-List | Out-File -Encoding utf8 ../SHA256-WINDOWS.txt
          $configuration=Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          [IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE 'WINDOWS-VERSION.txt'),$configuration.version,[Text.Encoding]::ASCII)
      - name: Instalador e integridade
        uses: actions/upload-artifact@v4
        with:
          name: Pitacco-Windows-x64
          path: |
            web/src-tauri/target/release/bundle/nsis/*.exe
            web/src-tauri/target/release/bundle/nsis/*.exe.sig
            WINDOWS-VERSION.txt
            SHA256-WINDOWS.txt
            ASSINATURA-WINDOWS.txt
            VERIFICACAO-WINDOWS.txt
          if-no-files-found: error
          retention-days: 30

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:isolated-ci-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar decodificador da voz no banco isolado
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python revisions/0.12/restore.py
      - run: npm ci --prefix web/tests/backend
      - run: npm install --prefix web/tests/backend --no-save --package-lock=false pg@8.16.3
      - run: node web/tests/backend/run.mjs
      - run: node web/tests/backend/concurrency.mjs


  publish-installer:
    name: Publicar instalador Windows para os lojistas
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [build, postgres]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar compilação validada
        uses: actions/download-artifact@v4
        with:
          name: Pitacco-Windows-x64
          path: release-files
      - name: Conferir integridade e preparar download
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, shutil
          base=Path('release-files')
          installers=list(base.rglob('*.exe'))
          manifests=list(base.rglob('SHA256-WINDOWS.txt'))
          defender=list(base.rglob('VERIFICACAO-WINDOWS.txt'))
          assert len(installers)==1 and len(manifests)==1 and len(defender)==1, 'Artefatos incompletos: instalador, SHA256 e resultado do Defender são obrigatórios'
          assert 'sem deteccao' in defender[0].read_text(encoding='utf-8-sig').lower(), 'Defender não confirmou a verificação'
          expected=re.findall(r'(?im)^\s*Hash\s*:\s*([a-f0-9]{64})\s*$',manifests[0].read_text(encoding='utf-8-sig'))
          assert len(expected)==1, 'Hash único não encontrado no manifesto'
          computed=hashlib.sha256(installers[0].read_bytes()).hexdigest()
          assert computed.lower()==expected[0].lower(), 'O instalador difere do SHA-256 da compilação'
          out=Path('release-ready');out.mkdir(exist_ok=True)
          shutil.copy2(installers[0],out/'Pitacco-Windows-Setup.exe')
          (out/'Pitacco-Windows-Setup.exe.sha256').write_text(computed+'  Pitacco-Windows-Setup.exe\n',encoding='ascii')
          version=next(base.rglob('WINDOWS-VERSION.txt')).read_text(encoding='ascii').strip()
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+',version), 'Versão do instalador inválida'
          signatures=list(base.rglob('*.exe.sig'))
          if signatures:
              assert len(signatures)==1 and signatures[0].stat().st_size>30, 'Assinatura Tauri inválida'
              shutil.copy2(signatures[0],out/'Pitacco-Windows-Setup.exe.sig')
              (out/'WINDOWS-VERSION.txt').write_text(version,encoding='ascii')
          print('Instalador conferido: SHA-256 igual ao manifesto e verificação Defender concluída.')
          PY
      - name: Disponibilizar instalador público
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="pitacco-windows-${GITHUB_SHA:0:12}"
          if [[ -f release-ready/Pitacco-Windows-Setup.exe.sig ]]; then
            export PITACCO_TAG="$tag"
            python3 - <<'PY_MANIFEST'
          from pathlib import Path
          import json,os
          tag=os.environ['PITACCO_TAG']
          signature=Path('release-ready/Pitacco-Windows-Setup.exe.sig').read_text(encoding='utf-8').strip()
          version=Path('release-ready/WINDOWS-VERSION.txt').read_text(encoding='ascii').strip()
          manifest={'version':version,'notes':'Atualização Pitacco Windows com correções de pedidos, despachos e alertas.',
             'platforms':{'windows-x86_64':{
                 'url':f'https://github.com/juniorclerio37-creator/pitacco/releases/download/{tag}/Pitacco-Windows-Setup.exe',
                 'signature':signature}}}
          Path('release-ready/latest.json').write_text(json.dumps(manifest,ensure_ascii=False),encoding='utf-8')
          PY_MANIFEST
          fi
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Versão de download já publicada: $tag"
          else
            files=(release-ready/Pitacco-Windows-Setup.exe release-ready/Pitacco-Windows-Setup.exe.sha256)
            if [[ -f release-ready/Pitacco-Windows-Setup.exe.sig ]]; then
              files+=(release-ready/Pitacco-Windows-Setup.exe.sig release-ready/latest.json)
            fi
            gh release create "$tag" "${files[@]}" --repo "$GH_REPO"               --target "$GITHUB_SHA"               --title "Pitacco Windows · ${GITHUB_SHA:0:12}"               --notes "Instalador do Pitacco Windows gerado pelo pipeline do projeto, com testes automatizados, verificação Microsoft Defender e hash SHA-256 disponível para conferência."               --latest
          fi
