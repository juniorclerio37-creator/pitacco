name: Pitacco Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'revisions/0.12/**'
      - 'source/**'
      - 'updates/**'
      - '.github/workflows/windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Verificar scripts Python
        working-directory: .
        run: python -m compileall -q revisions/0.12
      - name: Restaurar codigo preservado
        working-directory: .
        run: python -X utf8 revisions/0.12/restore.py
      - name: Validar configuracao unica de impressoras 0.12
        working-directory: .
        shell: python
        run: |
          from pathlib import Path
          # Check capabilities without assuming exact JSX wording.
          checks = {
            'editor de impressora': 'editingSector' in operations,
            'exclusao com verificacao de pendencias': (
              "from('print_jobs')" in operations
              and "from('print_sectors').delete()" in operations
              and "if(count>0)" in operations
            ),
            'sem controle legado de exclusao': 'Excluir impressora</button>' not in operations,
            'teste fisico de impressao': "invoke('test_printer'" in operations,
            'transferencia do computador': 'pitacco_switch_print_device' in operations,
            'desvinculacao do computador': 'pitacco_unbind_print_device' in operations,
            'painel unico de computador': operations.count('Computador responsável pela impressão') == 1,
          }
          for name, ok in checks.items():
              print(('OK' if ok else 'FALHOU') + ': ' + name)
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Validacao de impressoras: ' + ', '.join(failed))
          print('Controles de impressao preservados na base 0.12')
      - name: Empacotar codigo completo
        working-directory: .
        shell: python
        run: |
          import pathlib,zipfile
          with zipfile.ZipFile('Pitacco-0.12-Codigo-Completo.zip','w',zipfile.ZIP_DEFLATED) as z:
              for folder in ['web','android','docs']:
                  for p in pathlib.Path(folder).rglob('*'):
                      if p.is_file() and not any(x in p.parts for x in ['node_modules','target','dist','.git']): z.write(p)
      - uses: actions/upload-artifact@v4
        with:
          name: Pitacco-Codigo-Completo
          path: Pitacco-0.12-Codigo-Completo.zip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            web/src-tauri -> target
            web/native-tests -> target
      - name: Dependências
        run: npm ci
      - name: Testes JavaScript
        run: npm test
      - name: Dependências SQL
        run: npm ci --prefix tests/backend
      - name: Testes SQL
        run: npm test --prefix tests/backend
      - name: Testes fila nativa
        run: cargo test --locked --manifest-path native-tests/Cargo.toml
      - name: Dependencia de teste visual
        run: npm install --no-save --package-lock=false playwright@1.58.2
      - name: Teste de navegacao e quadro
        run: node tests/ui-smoke.mjs
      - name: Evidencias de interface
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pitacco-Interface
          path: web/ui-evidence/*.png
          if-no-files-found: ignore
      - name: Instalador NSIS
        run: npm run desktop:build -- --bundles nsis
      - name: Hashes dos instaladores
        run: Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Get-FileHash -Algorithm SHA256 | Format-List | Out-File -Encoding utf8 ../SHA256-WINDOWS.txt
      - name: Instalador e integridade
        uses: actions/upload-artifact@v4
        with:
          name: Pitacco-Windows-x64
          path: |
            web/src-tauri/target/release/bundle/nsis/*.exe
            SHA256-WINDOWS.txt
          if-no-files-found: error
          retention-days: 30

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:isolated-ci-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python revisions/0.12/restore.py
      - run: npm ci --prefix web/tests/backend
      - run: npm install --prefix web/tests/backend --no-save --package-lock=false pg@8.16.3
      - run: node web/tests/backend/run.mjs
      - run: node web/tests/backend/concurrency.mjs
