name: Pitacco Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'revisions/0.12/**'
      - 'source/**'
      - 'updates/**'
      - '.github/workflows/windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Verificar scripts Python
        working-directory: .
        run: python -m compileall -q revisions/0.12
      - name: Restaurar codigo preservado
        working-directory: .
        run: python -X utf8 revisions/0.12/restore.py
      - name: Verificar navegacao e renderizacao de Clientes e Fideliza+
        working-directory: .
        shell: python
        run: |
          from pathlib import Path
          src = Path('web/src.jsx').read_text(encoding='utf-8')
          operations = Path('web/Operations.jsx').read_text(encoding='utf-8')
          checks = {
              'Clientes no menu': "['Clientes'," in src,
              'Fideliza+ no menu': "['Fideliza+'," in src,
              'Clientes permitido no Windows': "'Fideliza+','Clientes','Atualizações'].includes(name)" in src,
              'Clientes com pagina propria': "tab==='Clientes'&&<CustomersFromOrders" in src,
              'Clientes isolados por loja': 'order.store_id!==storeId' in src,
              'Fideliza+ renderizado': "view==='Fideliza+'&&<Fideliza" in operations,
              'Fideliza+ visivel no roteador': "view==='Fideliza+'" in operations,
          }
          for name, ok in checks.items():
              print(('OK' if ok else 'FALHOU') + ': ' + name, flush=True)
          if not all(checks.values()):
              raise SystemExit('Modulos de Clientes/Fideliza+ nao estao conectados corretamente.')
      - name: Verificar identidade por loja e layout unificado
        working-directory: .
        shell: python
        run: |
          from pathlib import Path
          src = Path('web/src.jsx').read_text(encoding='utf-8')
          css = Path('web/style.css').read_text(encoding='utf-8')
          checks = {
              'Identidade da loja no menu': 'store-identity-copy' in src and 'storeBrand?.logo_url' in src,
              'Logo Pitacco somente no login': 'src="/pitacco-brand-013.svg" alt="Pitacco"' in src and '<div className="brand"><img src="/pitacco-logo.png"' not in src,
              'Identidade em web e Windows': "if(!session||!selected){setStoreBrand(null);return}" in src,
              'Layout geral': 'pitacco-workspace--overview' in css or 'pitacco-workspace .metrics' in css,
              'Layout de pedidos': 'pitacco-workspace--orders .orders-toolbar' in css,
              'Layout de impressao': 'pitacco-workspace--settings .pitacco-operations--printing' in css,
              'Layout de motoboys': 'pitacco-workspace--couriers .panel' in css,
              'Demais telas': 'pitacco-workspace--other .page-intro' in css,
          }
          for label, ok in checks.items():
              print(('OK' if ok else 'FALHOU') + ': ' + label, flush=True)
          if not all(checks.values()):
              raise SystemExit('Layout ou identidade por loja incompletos.')
      - name: Validar central de atualizacoes e verificacao Windows
        working-directory: .
        shell: python
        run: |
          from pathlib import Path
          src=Path('web/src.jsx').read_text(encoding='utf-8')
          operations=Path('web/Operations.jsx').read_text(encoding='utf-8')
          checks={
              'Central disponivel para administrador somente no site': "admin&&platformWorkspace&&!nativeAvailable()" in src and "current==='Atualizações'" in src,
              'Central no painel admin': "['Atualizações',Settings]" in src,
              'Menu da loja sem atualizacoes admin': "['Atualizações',Settings,'Principal']" not in src,
              'Verificacao nativa conectada': "invoke('check_update')" in operations,
              'Erros de verificacao exibidos': "setUpdateCheck({state:'error'" in operations,
              'Sem instalacao nao assinada': 'Esta verificação não instala arquivos.' in operations,
          }
          for label,ok in checks.items(): print(('OK' if ok else 'FALHOU')+': '+label,flush=True)
          if not all(checks.values()): raise SystemExit('Falha na central de atualizacoes.')
      - name: Verificar separacao entre administrador e lojista
        working-directory: .
        shell: python
        run: |
          from pathlib import Path
          src=Path('web/src.jsx').read_text(encoding='utf-8')
          checks={
              'Admin somente no navegador': 'if(admin&&platformWorkspace&&!nativeAvailable())' in src,
              'Windows inicia na loja': 'useState(()=>!nativeAvailable())' in src,
              'Troca de conta preserva isolamento': 'setPlatformWorkspace(!nativeAvailable())' in src,
              'Navegacao administrativa web': 'pitacco-admin-shell' in src,
              'Tema operacional preservado': 'pitacco-theme-' in src,
              'Entrada da loja exige vinculo': 'disabled={!stores.length}' in src,
              'Selecao de loja': 'setSelected(store.id);setPlatformWorkspace(false)' in src,
              'Marca da loja': 'storeBrand?.logo_url' in src,
              'Marca do painel web': 'pitacco-platform-brand' in src,
          }
          for label,ok in checks.items(): print(('OK' if ok else 'FALHOU')+': '+label,flush=True)
          if not all(checks.values()): raise SystemExit('Falha na separacao de ambientes.')
      - name: Diagnosticar controles de impressao 0.12
        working-directory: .
        shell: python
        run: |
          from pathlib import Path
          operations = Path('web/Operations.jsx').read_text(encoding='utf-8')
          checks = {
              'editor de impressora': 'editingSector' in operations,
              'protecao de trabalhos pendentes': "from('print_jobs')" in operations and "if(count>0)" in operations,
              'teste de impressao': "invoke('test_printer'" in operations,
              'transferencia de computador': 'pitacco_switch_print_device' in operations,
              'desvinculacao de computador': 'pitacco_unbind_print_device' in operations,
          }
          for name, ok in checks.items():
              print(('OK' if ok else 'ATENCAO') + ': ' + name, flush=True)
          print('Diagnostico informativo: compilacao e testes funcionais continuam.', flush=True)
      - name: Validar isolamento de falhas e identidade da loja
        working-directory: .
        shell: python
        run: |
          from pathlib import Path
          operations=Path('web/Operations.jsx').read_text(encoding='utf-8')
          src=Path('web/src.jsx').read_text(encoding='utf-8')
          checks={
              'Fila de impressao isolada': "setStatus('Pedidos sincronizados · impressão pendente')" in operations,
              'Falha da impressora identificada': "setError('Impressão: '" in operations,
              'Erro de ACK tratado separadamente': 'Confirmação de impressão pendente:' in operations,
              'Marca da loja existente': 'storeBrand?.logo_url' in src,
              'Pedidos com numero legivel': 'displayOrderNumber(o)' in operations,
          }
          for name,ok in checks.items(): print(('OK' if ok else 'FALHOU')+': '+name,flush=True)
          if not all(checks.values()): raise SystemExit('Regressao de sincronizacao, identidade ou pedidos.')
      - name: Empacotar codigo completo
        working-directory: .
        shell: python
        run: |
          import pathlib,zipfile
          with zipfile.ZipFile('Pitacco-0.12-Codigo-Completo.zip','w',zipfile.ZIP_DEFLATED) as z:
              for folder in ['web','android','docs']:
                  for p in pathlib.Path(folder).rglob('*'):
                      if p.is_file() and not any(x in p.parts for x in ['node_modules','target','dist','.git']): z.write(p)
      - uses: actions/upload-artifact@v4
        with:
          name: Pitacco-Codigo-Completo
          path: Pitacco-0.12-Codigo-Completo.zip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            web/src-tauri -> target
            web/native-tests -> target
      - name: Dependências
        run: npm ci
      - name: Testes JavaScript
        run: npm test
      - name: Dependências SQL
        run: npm ci --prefix tests/backend
      - name: Testes SQL
        run: npm test --prefix tests/backend
      - name: Testes fila nativa
        run: cargo test --locked --manifest-path native-tests/Cargo.toml
      - name: Dependencia de teste visual
        run: npm install --no-save --package-lock=false playwright@1.58.2
      - name: Teste de navegacao e quadro
        run: node tests/ui-smoke.mjs
      - name: Evidencias de interface
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pitacco-Interface
          path: web/ui-evidence/*.png
          if-no-files-found: ignore
      - name: Instalador NSIS
        run: npm run desktop:build -- --bundles nsis
      - name: Assinar instalador quando certificado estiver configurado
        shell: pwsh
        env:
          PITACCO_SIGN_PFX_BASE64: ${{ secrets.PITACCO_SIGN_PFX_BASE64 }}
          PITACCO_SIGN_PFX_PASSWORD: ${{ secrets.PITACCO_SIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem 'web/src-tauri/target/release/bundle/nsis/*.exe')
          if ($installers.Count -eq 0) { throw 'Nenhum instalador encontrado para assinatura.' }
          $hasPfx = -not [string]::IsNullOrWhiteSpace($env:PITACCO_SIGN_PFX_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:PITACCO_SIGN_PFX_PASSWORD)
          if ($hasPfx -ne $hasPassword) { throw 'Configure ambos os segredos de assinatura ou nenhum.' }
          if (-not $hasPfx) {
            'NAO ASSINADO: certificado de assinatura de codigo nao configurado.' | Out-File -Encoding utf8 'ASSINATURA-WINDOWS.txt'
            Write-Warning 'Instalador NAO ASSINADO. Nao distribuir como versao verificada.'
          } else {
            $pfxPath = Join-Path $env:RUNNER_TEMP 'pitacco-signing.pfx'
            try {
              [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PITACCO_SIGN_PFX_BASE64))
              $password = ConvertTo-SecureString $env:PITACCO_SIGN_PFX_PASSWORD -AsPlainText -Force
              $cert = Get-PfxCertificate -FilePath $pfxPath -Password $password
              if (-not $cert.HasPrivateKey) { throw 'Certificado sem chave privada.' }
              $codeSigningOid = '1.3.6.1.5.5.7.3.3'
              $eku = @($cert.EnhancedKeyUsageList | ForEach-Object { $_.ObjectId })
              if ($eku -notcontains $codeSigningOid) { throw 'Certificado nao autorizado para assinatura de codigo.' }
              $signingCert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\\CurrentUser\\My -Password $password
              foreach ($installer in $installers) {
                $signature = Set-AuthenticodeSignature -FilePath $installer.FullName -Certificate $signingCert -TimestampServer 'http://timestamp.digicert.com' -HashAlgorithm SHA256
                if ($signature.Status -ne 'Valid') { throw "Assinatura falhou: $($installer.Name) - $($signature.Status)" }
                $verified = Get-AuthenticodeSignature -FilePath $installer.FullName
                if ($verified.Status -ne 'Valid') { throw "Assinatura nao validada: $($installer.Name)" }
              }
              "ASSINADO: $($signingCert.Subject); Thumbprint: $($signingCert.Thumbprint)" | Out-File -Encoding utf8 'ASSINATURA-WINDOWS.txt'
            } finally {
              Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
              if ($signingCert) { Remove-Item "Cert:\\CurrentUser\\My\\$($signingCert.Thumbprint)" -Force -ErrorAction SilentlyContinue }
            }
          }
      - name: Hashes dos instaladores
        run: Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Get-FileHash -Algorithm SHA256 | Format-List | Out-File -Encoding utf8 ../SHA256-WINDOWS.txt
      - name: Instalador e integridade
        uses: actions/upload-artifact@v4
        with:
          name: Pitacco-Windows-x64
          path: |
            web/src-tauri/target/release/bundle/nsis/*.exe
            SHA256-WINDOWS.txt
            ASSINATURA-WINDOWS.txt
          if-no-files-found: error
          retention-days: 30

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:isolated-ci-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python revisions/0.12/restore.py
      - run: npm ci --prefix web/tests/backend
      - run: npm install --prefix web/tests/backend --no-save --package-lock=false pg@8.16.3
      - run: node web/tests/backend/run.mjs
      - run: node web/tests/backend/concurrency.mjs
