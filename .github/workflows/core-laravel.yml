name: Pitacco Core — Laravel foundation
on:
  push:
    branches: [pitacco-core]
    paths:
      - 'backend/**'
      - '.github/workflows/core-laravel.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pitacco-core-laravel
  cancel-in-progress: false
jobs:
  test:
    if: github.ref == 'refs/heads/pitacco-core'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_HOST: 127.0.0.1
      DB_DATABASE: postgres
      DB_USERNAME: pitacco_core_app
      DB_PASSWORD: ci-app-only
      MENU_DB_USERNAME: pitacco_core_menu
      MENU_DB_PASSWORD: ci-menu-only
      REDIS_HOST: 127.0.0.1
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: array
      LOG_CHANNEL: stderr
      PITACCO_MENU_ENABLED: 'true'
      PITACCO_AUTH_ENABLED: 'true'
      CORE_AUTH_DB_USERNAME: pitacco_core_auth
      CORE_AUTH_DB_PASSWORD: ci-auth-only
      CORE_ORDERS_DB_USERNAME: pitacco_core_orders
      CORE_ORDERS_DB_PASSWORD: ci-orders-only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, mbstring, dom, curl
          tools: composer:v2
          coverage: none
      - name: Resolver dependências e validar sintaxe
        working-directory: backend
        run: |
          composer validate
          if test -f composer.lock; then composer install --no-interaction --prefer-dist; else composer update --no-interaction --prefer-dist; fi
          composer audit --locked
          find app bootstrap config routes public -name '*.php' -print0 | xargs -0 -n1 php -l
          php artisan route:list
      - name: Preparar banco exclusivamente sintético
        run: |
          PGPASSWORD=isolated-ci-password psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f backend/tests/fixture.sql
          hash=$(php -r 'echo password_hash("fixture-only-password", PASSWORD_BCRYPT, ["cost"=>12]);')
          PGPASSWORD=isolated-ci-password psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -v password_hash="$hash" -f backend/tests/auth-fixture.sql
          PGPASSWORD=isolated-ci-password psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f backend/tests/orders-fixture.sql -f supabase/migrations/20261125222344_daily_operational_orders.sql
          test "$(PGPASSWORD=ci-orders-only psql -h 127.0.0.1 -U pitacco_core_orders -d postgres -Atc 'select count(*) from public.orders')" = 0
          if PGPASSWORD=ci-orders-only psql -h 127.0.0.1 -U pitacco_core_orders -d postgres -v ON_ERROR_STOP=1 -c 'update public.orders set gross=0'; then exit 1; fi
          if PGPASSWORD=ci-auth-only psql -h 127.0.0.1 -U pitacco_core_auth -d postgres -v ON_ERROR_STOP=1 -c 'update core_auth.memberships set role=role'; then exit 1; fi
          if PGPASSWORD=ci-menu-only psql -h 127.0.0.1 -U pitacco_core_menu -d postgres -v ON_ERROR_STOP=1 -c 'select * from fixture_private.menus'; then
            echo 'Menu role can read private table' >&2
            exit 1
          fi
      - name: Testar API Laravel por HTTP
        working-directory: backend
        run: |
          set -euo pipefail
          php artisan serve --host=127.0.0.1 --port=8080 >/tmp/pitacco-core-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; cat /tmp/pitacco-core-http.log' EXIT
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/up >/dev/null && break; sleep 1; done
          python3 tests/http-smoke.py
          python3 tests/auth-smoke.py
          python3 tests/orders-smoke.py
      - name: Verificar bloqueio padrão de produção
        working-directory: backend
        run: |
          APP_ENV=production php artisan serve --host=127.0.0.1 --port=8081 >/tmp/pitacco-core-disabled.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:8081/up >/dev/null && break; sleep 1; done
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Accept: application/json' http://127.0.0.1:8081/api/v1/public/menus/loja-a)" = 404
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Accept: application/json' http://127.0.0.1:8081/api/v1/auth/me)" = 404
      - name: Versionar lock somente após testes
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/pitacco-core
          git add -- backend/composer.lock
          if git diff --cached --quiet; then exit 0; fi
          test "$(git diff --cached --name-only)" = backend/composer.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "core: lock audited Laravel dependencies"
          git push origin HEAD:refs/heads/pitacco-core
