name: Inspecionar cardápio Brendi para migração
on:
  push:
    branches:
      - brendi-import-acai-linho-20261123
    paths:
      - .github/workflows/brendi-import-probe.yml
      - scripts/brendi_snapshot_extract.py
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Ler e normalizar catálogo público
        run: python scripts/brendi_snapshot_extract.py
      - name: Salvar snapshot na branch de inspeção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imports/brendi-acai-do-linho.snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "data(import): snapshot do catálogo público Brendi"
            git push
          fi
